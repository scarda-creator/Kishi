","c":true},{"x":"entrambi ruotano di $\\pi$"},{"x":"solo $\\theta_2$ ruota di $\\pi$"},{"x":"$\\theta_1$ ruota di $2\\pi$, $\\theta_2$ di $0$"}],"hint":"Andando da $x>1$ verso $0$ lungo il semipiano superiore, il vettore $z+1$ resta sempre a parte reale positiva (angolo $\\approx0$); solo $z-1$ passa dal semiasse positivo a quello negativo.","sol":"<b>Trasporto degli angoli (soluzione ufficiale 20/06/2023).</b> Muovendo $z$ da $x>1$ fino a $0$ nel semipiano superiore, $z+1$ resta reale positivo: $\\theta_2=0$. Invece $z-1$ passa da positivo a $-1$: il suo angolo cresce con continuit&agrave; fino a $\\theta_1=\\pi$. Ruota UN SOLO fattore: e' esattamente la situazione in cui e' facile sbagliare ruotando anche l'altro.","cont":"Ora il valore in $z=0$ &rarr;"},{"t":"Con $\\theta_1=\\pi$, $\\theta_2=0$, quanto vale $f(0)$?","opts":[{"x":"$f(0)=i$ (immaginaria positiva)","c":true},{"x":"$f(0)=1$ (reale positiva)"},{"x":"$f(0)=-1$"},{"x":"$f(0)=-i$"}],"hint":"$f(0)=\\sqrt{r_1 r_2}\\,e^{i(\\theta_1+\\theta_2)/2}$ con $r_1=r_2=1$; resta solo la fase $e^{i\\pi/2}$.","sol":"<b>Valore in $z=0$ (soluzione ufficiale: $f(0)=i$).</b> $r_1=|0-1|=1$, $r_2=|0+1|=1$, quindi $\\sqrt{r_1 r_2}=1$; la fase e' $e^{i(\\pi+0)/2}=e^{i\\pi/2}=i$. Dunque $f(0)=i$: la determinazione in $0$ NON e' reale, e' immaginaria pura. Chi ruota (per errore) anche $\\theta_2$ ottiene $e^{i\\pi}=-1$ e sbaglia il segno/tipo del valore."}]},{"pool":"polidrome","src":"20230620 Es.2","steps":[{"t":"Stessa $f=(z^2-1)^{1/2}$, stessa determinazione. Valore SOTTO il taglio di destra ($x>1$): si ruota attorno a $+1$ di $2\\pi$ (antiorario). Il valore e':","opts":[{"x":"$-\\sqrt{x^2-1}$ (reale negativa): $\\theta_1=2\\pi,\\ \\theta_2=0$, fase $e^{i\\pi}=-1$","c":true},{"x":"$+\\sqrt{x^2-1}$: identico a sopra il taglio"},{"x":"$i\\sqrt{x^2-1}$"},{"x":"$-i\\sqrt{x^2-1}$"}],"hint":"Attraversare il taglio di destra fa fare a $z-1$ un giro completo: $\\theta_1$ passa da $0$ a $2\\pi$, la mezza-potenza acquista $e^{i\\pi}$.","sol":"<b>Sotto il taglio destro (soluzione ufficiale).</b> Per passare sotto, $z-1$ compie un giro $2\\pi$ antiorario: $\\theta_1=2\\pi$, $\\theta_2=0$, fase $e^{i(2\\pi)/2}=e^{i\\pi}=-1$. Quindi $f=-\\sqrt{x^2-1}$: la funzione e' reale negativa. Il salto attraverso il taglio e' un fattore $-1$, coerente col fatto che il segmento $[1,+\\infty)$ e' un taglio vero.","cont":"Ora i due lati del taglio di sinistra &rarr;"},{"t":"Valore SOPRA il taglio di sinistra ($x<-1$): si ruota di $\\pi$ (antiorario) attorno a ENTRAMBI i punti. Risultato:","opts":[{"x":"$-\\sqrt{x^2-1}$: $\\theta_1=\\pi,\\ \\theta_2=\\pi$, fase $e^{i\\pi}=-1$","c":true},{"x":"$+\\sqrt{x^2-1}$"},{"x":"$i\\sqrt{x^2-1}$"},{"x":"$0$"}],"hint":"Per arrivare sopra il taglio sinistro dal riferimento entrambi i vettori $z\\mp1$ raggiungono il semiasse negativo dall'alto: $\\theta_1=\\theta_2=\\pi$.","sol":"<b>Sopra il taglio sinistro (soluzione ufficiale).</b> $\\theta_1=\\pi$, $\\theta_2=\\pi$, fase $e^{i(\\pi+\\pi)/2}=e^{i\\pi}=-1$: $f=-\\sqrt{x^2-1}$, reale negativa.","cont":"E sotto il taglio sinistro &rarr;"},{"t":"Valore SOTTO il taglio di sinistra: $\\theta_1=\\pi$ (antiorario attorno a $+1$), $\\theta_2=-\\pi$ (ORARIO attorno a $-1$). Risultato:","opts":[{"x":"$+\\sqrt{x^2-1}$: fase $e^{i(\\pi-\\pi)/2}=e^{0}=1$","c":true},{"x":"$-\\sqrt{x^2-1}$"},{"x":"$i\\sqrt{x^2-1}$"},{"x":"$-i\\sqrt{x^2-1}$"}],"hint":"Qui il verso attorno ai due punti e' OPPOSTO: $+\\pi$ attorno a $1$, $-\\pi$ attorno a $-1$. Gli angoli si sottraggono nella somma $\\theta_1+\\theta_2=0$.","sol":"<b>Sotto il taglio sinistro (soluzione ufficiale).</b> $\\theta_1=\\pi$, $\\theta_2=-\\pi$: la somma $\\theta_1+\\theta_2=0$, fase $e^{0}=1$, quindi $f=+\\sqrt{x^2-1}$, reale positiva. E' il punto pi&ugrave; delicato: il verso di rotazione attorno a $-1$ e' orario, e cambiarlo (mettendo $+\\pi$) darebbe erroneamente $-\\sqrt{x^2-1}$. La direzione della rotazione E' l'informazione."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"Attraversando un taglio, il segno di $(z^2-1)^{1/2}=(z-1)^{1/2}(z+1)^{1/2}$ cambia quando:","opts":[{"x":"il cammino circonda un numero DISPARI di punti di diramazione (uno solo dei due fattori compie un giro)","c":true},{"x":"sempre, per qualunque taglio attraversato"},{"x":"mai, perch&eacute; il prodotto e' monodromo"},{"x":"solo attraversando il segmento $[-1,1]$"}],"hint":"Ogni fattore che compie un giro $2\\pi$ contribuisce $e^{i\\pi}=-1$. Due fattori insieme danno $(-1)(-1)=+1$.","sol":"<b>Conteggio dei cambi di ramo (nucleo 11, collaudo).</b> Ogni fattore $(z-z_0)^{1/2}$ acquista $-1$ se il cammino avvolge $z_0$ una volta. Attraversare un taglio esterno avvolge UN solo punto: segno $-1$. Un cammino che avvolge entrambi (attorno a tutto il segmento) d&agrave; $(-1)^2=+1$: e' la ragione per cui fuori dal segmento $[-1,1]$ la funzione e' monodroma."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"TRAPPOLA. L'errore piu' frequente nel tipo 'valori sul taglio' e':","opts":[{"x":"ruotare l'angolo di UN SOLO fattore quando andrebbero ruotati entrambi (o viceversa): si sbaglia la fase $e^{i(\\theta_1+\\theta_2)/2}$","c":true},{"x":"dimenticare di normalizzare la funzione"},{"x":"usare $z=e^{i\\theta}$ invece della forma polare"},{"x":"calcolare il residuo con la formula del polo semplice"}],"hint":"La fase dipende dalla SOMMA $\\theta_1+\\theta_2$: basta sbagliare la rotazione di uno dei due per ottenere una fase diversa di $\\pi$, cio&egrave; un segno o un fattore $i$ sbagliato.","sol":"<b>Trappola dichiarata (b01).</b> 'Errore sull'angolo di un fattore' e' la prima trappola censita per questo tipo. La fase e' $e^{i(\\theta_1+\\theta_2)/2}$: una rotazione sbagliata di $\\pi$ su UN solo $\\theta$ altera la fase di $\\pi/2$, trasformando (per esempio) un valore reale in immaginario. Rimedio: disegnare i due vettori $z-1$ e $z+1$ e tracciarne gli angoli separatamente, attorno al punto giusto e nel verso giusto."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"TRAPPOLA. Nel calcolo dell'integrale $\\int f\\,dx$ per contorno attorno al taglio, il segno del risultato:","opts":[{"x":"dipende dal VERSO (orario/antiorario) con cui il contorno circonda il taglio: sbagliarlo inverte il segno di $I$","c":true},{"x":"e' sempre positivo perch&eacute; l'integrando e' reale"},{"x":"non dipende dal contorno, solo dai residui"},{"x":"e' fissato dalla determinazione sopra il taglio"}],"hint":"$\\oint$ orario $=-\\oint$ antiorario. Il teorema dei residui d&agrave; $+2\\pi i\\sum\\mathrm{Res}$ in senso antiorario, $-2\\pi i\\sum\\mathrm{Res}$ in senso orario.","sol":"<b>Trappola dichiarata (b01) + teorema dei residui (nucleo 13).</b> 'Il segno dell'integrale dipende dal verso del contorno'. Il compito 16/11/2023 sceglie una curva che circonda il taglio in senso ORARIO: allora $\\oint f=-2\\pi i\\,\\mathrm{Res}_\\infty$. Dichiarare sempre il verso per iscritto e riportarlo nel segno: e' il punto in cui il correttore verifica la comprensione, non il calcolo."}]},{"pool":"polidrome","src":"20230704 Es.1","steps":[{"t":"Il residuo all'infinito si calcola con:","opts":[{"x":"$\\mathrm{Res}_\\infty f=-\\mathrm{Res}_{w=0}\\!\\left[\\dfrac{1}{w^2}f\\!\\left(\\dfrac1w\\right)\\right]$: attenzione al segno MENO","c":true},{"x":"$\\mathrm{Res}_\\infty f=+\\mathrm{Res}_{w=0}\\!\\left[\\dfrac{1}{w^2}f\\!\\left(\\dfrac1w\\right)\\right]$"},{"x":"$\\mathrm{Res}_\\infty f=\\lim_{z\\to\\infty} z\\,f(z)$"},{"x":"$\\mathrm{Res}_\\infty f=-\\sum_{\\text{poli finiti}}\\mathrm{Res}$, sempre"}],"hint":"La sostituzione $z=1/w$ porta un fattore $-dz/w^2=... $, e il segno meno viene proprio da $dz=-dw/w^2$ e dall'inversione dell'orientamento.","sol":"<b>Residuo all'infinito (nucleo 13).</b> $\\mathrm{Res}_\\infty f=-\\mathrm{Res}_{w=0}[w^{-2}f(1/w)]$. Il segno meno e' la trappola censita per il 04/07/2023: dimenticarlo d&agrave; il risultato opposto. (Vale anche $\\mathrm{Res}_\\infty f=-\\sum$ residui finiti solo se non ci sono altri contributi, es. tagli: qui NON e' cos&igrave;.)"}]},{"pool":"polidrome","src":"20231116 Es.2","steps":[{"t":"$f(z)=i(z-1)^{1/2}(z+2)^{1/2}$, taglio $[-2,1]$, reale positiva sopra. Per il residuo all'infinito si pone $z=1/w$ e si sviluppa $\\dfrac{i}{w^3}\\sqrt{(1-w)(1+2w)}$ attorno a $w=0$. Lo sviluppo di $\\sqrt{1+w-2w^2}$ e':","opts":[{"x":"$1+\\dfrac{w}{2}-\\dfrac{9}{8}w^2+\\cdots$","c":true},{"x":"$1+\\dfrac{w}{2}-\\dfrac{1}{8}w^2+\\cdots$"},{"x":"$1-\\dfrac{w}{2}+\\dfrac{9}{8}w^2+\\cdots$"},{"x":"$1+w-2w^2+\\cdots$"}],"hint":"$\\sqrt{1+u}=1+\\tfrac{u}{2}-\\tfrac{u^2}{8}+\\cdots$ con $u=w-2w^2$; tieni i termini fino a $w^2$: da $\\tfrac{u}{2}$ viene $-w^2$, da $-\\tfrac{u^2}{8}$ viene $-\\tfrac{w^2}{8}$.","sol":"<b>Sviluppo binomiale.</b> $(1-w)(1+2w)=1+w-2w^2$. Con $u=w-2w^2$: $\\sqrt{1+u}=1+\\tfrac{u}{2}-\\tfrac{u^2}{8}=1+\\tfrac{w-2w^2}{2}-\\tfrac{w^2}{8}=1+\\tfrac{w}{2}-w^2-\\tfrac{w^2}{8}=1+\\tfrac{w}{2}-\\tfrac98 w^2$. Il coefficiente di $w^2$ e' $-9/8$.","cont":"Ora estrai il residuo &rarr;"},{"t":"Da $\\mathrm{Res}_\\infty=-\\mathrm{Res}_{w=0}\\!\\left[\\dfrac{i}{w^3}\\sqrt{1+w-2w^2}\\right]$, quanto vale?","opts":[{"x":"$\\mathrm{Res}_\\infty f=-\\dfrac{9i}{8}$","c":true},{"x":"$\\mathrm{Res}_\\infty f=+\\dfrac{9i}{8}$"},{"x":"$\\mathrm{Res}_\\infty f=-\\dfrac{i}{8}$"},{"x":"$\\mathrm{Res}_\\infty f=\\dfrac{i}{2}$"}],"hint":"$\\mathrm{Res}_{w=0}$ di $\\dfrac{i}{w^3}(a_0+a_1 w+a_2 w^2+\\cdots)$ e' $i\\,a_2$; poi anteponi il segno meno della formula del residuo all'infinito.","sol":"<b>Residuo all'infinito (soluzione ufficiale: $-9i/8$).</b> Il residuo in $w=0$ di $\\tfrac{i}{w^3}(1+\\tfrac w2-\\tfrac98 w^2)$ e' il coefficiente di $w^{-1}$, cio&egrave; $i\\cdot(-\\tfrac98)=-\\tfrac{9i}{8}$; con il segno della formula $\\mathrm{Res}_\\infty=-\\mathrm{Res}_{w=0}[\\cdots]$ si conclude... la soluzione ufficiale riporta direttamente $\\mathrm{Res}_\\infty f=-\\tfrac{9i}{8}$ (avendo gi&agrave; incluso il segno nella scrittura $-\\tfrac{1}{w^2}f(1/w)$). Il valore verificato e' $-9i/8$."}]},{"pool":"polidrome","src":"20231116 Es.2","steps":[{"t":"Nella funzione $f(z)=i(z-1)^{1/2}(z+2)^{1/2}$, a cosa serve il prefattore $i$?","opts":[{"x":"a rendere $f$ reale positiva sopra il taglio con la scelta $\\theta_1=-\\pi,\\ \\theta_2=0$: senza $i$ la fase resterebbe $e^{-i\\pi/2}=-i$","c":true},{"x":"a spostare i punti di diramazione"},{"x":"a garantire la convergenza dell'integrale"},{"x":"non ha alcun ruolo, e' decorativo"}],"hint":"Sopra il taglio la soluzione ufficiale sceglie $\\theta_1=-\\pi$: allora $e^{i\\theta_1/2}=e^{-i\\pi/2}=-i$, e il prefattore $i$ lo cancella dando $+1$.","sol":"<b>Ruolo del prefattore (soluzione ufficiale 16/11/2023).</b> Con $\\theta_1=-\\pi$, $\\theta_2=0$ sopra il taglio, $e^{i(\\theta_1+\\theta_2)/2}=e^{-i\\pi/2}=-i$; il prefattore $i$ lo neutralizza: $i\\cdot(-i)=1$, e $f=\\sqrt{r_1 r_2}=\\sqrt{(1-x)(x+2)}$, reale positiva. Il prefattore FISSA la determinazione insieme alla scelta degli angoli: e' parte integrante della definizione della funzione, non un dettaglio."}]},{"pool":"polidrome","src":"20231116 Es.2","steps":[{"t":"Per $\\int_{-2}^{1}\\sqrt{2-x-x^2}\\,dx$ si sfrutta che sopra il taglio $f=i(z-1)^{1/2}(z+2)^{1/2}$ vale $\\sqrt{2-x-x^2}$. Un contorno $\\gamma$ orario attorno al taglio d&agrave; $\\oint_\\gamma f\\,dz=2I$ perch&eacute;:","opts":[{"x":"sopra il taglio $f=+\\sqrt{2-x-x^2}$ e sotto $f=-\\sqrt{2-x-x^2}$, ma il verso e' invertito: i due lati SOMMANO invece di cancellarsi","c":true},{"x":"i due lati del taglio danno contributi opposti che si cancellano, e resta l'arco"},{"x":"il contorno racchiude un polo doppio in $z=0$"},{"x":"la funzione e' monodroma sul taglio"}],"hint":"Come nel keyhole (nucleo 13): se la funzione fosse monodroma i due lati si annullerebbero. E' proprio il cambio di segno di $f$ da un lato all'altro, unito al verso opposto, a dare $2I$ e non $0$.","sol":"<b>Contorno attorno al taglio (nucleo 13, meccanismo keyhole).</b> Sopra $f=+\\sqrt{2-x-x^2}$, sotto $f=-\\sqrt{2-x-x^2}$ (un fattore ha ruotato); percorrendo il lato inferiore in verso opposto, $(-\\sqrt{\\cdots})\\cdot(-dx)=+\\sqrt{\\cdots}\\,dx$: i due tratti danno $2\\int\\sqrt{2-x-x^2}\\,dx=2I$. E' la polidromia a rendere possibile il calcolo, esattamente come nel buco della serratura.","cont":"Ora chiudi con il residuo all'infinito &rarr;"},{"t":"Con $\\mathrm{Res}_\\infty f=-\\tfrac{9i}{8}$ e $\\oint_\\gamma f=2I$ (contorno orario, quindi $\\oint_\\gamma f=2\\pi i\\,\\mathrm{Res}_\\infty$ col segno del verso), si ottiene:","opts":[{"x":"$I=\\dfrac{9\\pi}{8}$","c":true},{"x":"$I=-\\dfrac{9\\pi}{8}$"},{"x":"$I=\\dfrac{9\\pi}{4}$"},{"x":"$I=\\dfrac{9i\\pi}{8}$"}],"hint":"Verifica geometrica: $2-x-x^2=\\tfrac94-(x+\\tfrac12)^2$ e' il quadrato di una semicirconferenza di raggio $3/2$; l'integrale e' l'area del semicerchio $=\\tfrac{\\pi}{2}(\\tfrac32)^2$.","sol":"<b>Risultato (soluzione ufficiale: $I=9\\pi/8$).</b> $2I=2\\pi i\\,(-\\tfrac{9i}{8})=\\tfrac{9\\pi}{4}$, quindi $I=\\tfrac{9\\pi}{8}$. Controllo indipendente: $2-x-x^2=\\tfrac94-(x+\\tfrac12)^2$, semicerchio di raggio $3/2$ su $[-2,1]$, area $=\\tfrac12\\pi(\\tfrac32)^2=\\tfrac{9\\pi}{8}$. I due metodi coincidono: e' la conferma che segno e determinazione sono corretti."}]},{"pool":"polidrome","src":"20230620 Es.2","steps":[{"t":"Per $\\int_1^{\\infty}\\dfrac{dx}{x^3\\sqrt{x^2-1}}$ si integra $\\dfrac{1}{z^3}f(z)$ con $f=(z^2-1)^{1/2}$ (tagli esterni) su un contorno che circonda i tagli e racchiude $z=0$. Che singolarita' introduce il fattore $1/z^3$?","opts":[{"x":"un polo TRIPLO in $z=0$: il residuo richiede $\\dfrac{1}{2!}\\dfrac{d^2}{dz^2}$","c":true},{"x":"un polo semplice in $z=0$"},{"x":"un punto di diramazione in $z=0$"},{"x":"nessuna: $z=0$ e' regolare"}],"hint":"$1/z^3$ moltiplica una funzione regolare e non nulla in $0$ ($f(0)=i\\neq0$): l'ordine del polo e' esattamente $3$.","sol":"<b>Ordine del polo e formula del residuo (nucleo 13).</b> $f(0)=i\\neq0$, quindi $z^{-3}f(z)$ ha un polo di ordine $3$ in $0$. La soluzione ufficiale usa $4I=2\\pi i\\,\\mathrm{Res}_{z=0}[z^{-3}f(z)]=\\pi i\\,\\dfrac{d^2}{dz^2}\\dfrac{1}{f(z)}\\big|_0$ (il fattore $4$ viene dai quattro tratti del contorno che, per simmetria, valgono ciascuno $I$).","cont":"Ora il valore &rarr;"},{"t":"La soluzione ufficiale conclude $I=\\dfrac{\\pi}{4}$. Un controllo indipendente:","opts":[{"x":"$x=\\sec\\theta$: $dx=\\sec\\theta\\tan\\theta\\,d\\theta$, $\\sqrt{x^2-1}=\\tan\\theta$, e l'integrale diventa $\\int_0^{\\pi/2}\\cos^2\\theta\\,d\\theta=\\dfrac{\\pi}{4}$","c":true},{"x":"$x=\\sin\\theta$, che d&agrave; $\\int_0^{\\pi/2}d\\theta=\\dfrac{\\pi}{2}$"},{"x":"$x=e^t$, che d&agrave; un integrale divergente"},{"x":"nessun controllo elementare e' possibile"}],"hint":"Con $x=\\sec\\theta$ il radicale si semplifica: $\\sqrt{\\sec^2\\theta-1}=\\tan\\theta$, e $x^3=\\sec^3\\theta$.","sol":"<b>Verifica per sostituzione ($I=\\pi/4$).</b> $\\dfrac{\\sec\\theta\\tan\\theta}{\\sec^3\\theta\\,\\tan\\theta}d\\theta=\\cos^2\\theta\\,d\\theta$, con $\\theta:0\\to\\pi/2$; e $\\int_0^{\\pi/2}\\cos^2\\theta\\,d\\theta=\\pi/4$. Coincide con il metodo dei residui: conferma indipendente del risultato ufficiale $I=\\pi/4$."}]},{"pool":"polidrome","src":"20241106 Es.2","steps":[{"t":"$\\int_0^{\\infty}\\dfrac{\\sqrt{x}}{x^2+1}\\,dx$: branch point in $z=0$, taglio sul semiasse reale NEGATIVO ($\\arg z\\in(-\\pi,\\pi)$), poli semplici in $z=\\pm i$. Si chiude con semicirconferenza superiore $C_R$ + asse reale negativo $\\gamma_-$. Su $\\gamma_-$ ($z=x<0$, sopra il taglio) quanto vale $\\sqrt{z}$?","opts":[{"x":"$\\sqrt{z}=\\sqrt{|x|}\\,e^{i\\pi/2}=i\\sqrt{|x|}$","c":true},{"x":"$\\sqrt{z}=-\\sqrt{|x|}$"},{"x":"$\\sqrt{z}=\\sqrt{|x|}$"},{"x":"$\\sqrt{z}=e^{i\\pi}\\sqrt{|x|}$"}],"hint":"Sopra il taglio negativo $\\arg z=\\pi$, quindi $\\sqrt z=\\sqrt{|z|}\\,e^{i\\arg z/2}=\\sqrt{|x|}\\,e^{i\\pi/2}$.","sol":"<b>Valore del ramo su $\\gamma_-$ (soluzione 06/11/2024).</b> Con taglio sul semiasse negativo e $\\arg z\\in(-\\pi,\\pi)$, appena sopra il semiasse negativo $\\arg z\\to\\pi$, dunque $\\sqrt z=\\sqrt{|x|}\\,e^{i\\pi/2}=i\\sqrt{|x|}$. E' il contributo $+iI$ nel bilancio del contorno: NON $-I$. Questo distingue il taglio negativo dal keyhole standard.","cont":"Ora imposta il bilancio del contorno &rarr;"},{"t":"Il tratto reale positivo d&agrave; $I$, il tratto $\\gamma_-$ (percorso in verso opposto, con $\\sqrt z=i\\sqrt{|x|}$) d&agrave; $iI$, gli archi svaniscono. Quindi $(1+i)I=2\\pi i\\,\\mathrm{Res}_{z=i}$. Con $\\mathrm{Res}_{z=i}\\dfrac{\\sqrt z}{z^2+1}=\\dfrac{e^{i\\pi/4}}{2i}$ si ottiene:","opts":[{"x":"$I=\\dfrac{\\pi}{\\sqrt2}$","c":true},{"x":"$I=\\dfrac{\\pi}{2}$"},{"x":"$I=\\dfrac{\\pi}{2\\sqrt2}$"},{"x":"$I=\\pi\\sqrt2$"}],"hint":"$(1+i)I=2\\pi i\\cdot\\dfrac{e^{i\\pi/4}}{2i}=\\pi e^{i\\pi/4}=\\pi\\dfrac{1+i}{\\sqrt2}$; dividi per $(1+i)$.","sol":"<b>Risultato (soluzione ufficiale: $I=\\pi/\\sqrt2$).</b> $\\mathrm{Res}_{z=i}=\\dfrac{\\sqrt i}{2i}=\\dfrac{e^{i\\pi/4}}{2i}$ (formula del quoziente, $Q'=2z$). Allora $(1+i)I=\\pi e^{i\\pi/4}=\\pi\\dfrac{1+i}{\\sqrt2}$, da cui $I=\\pi/\\sqrt2$. Controllo per sostituzione $x=t^2$: $I=2\\int_0^\\infty\\dfrac{t^2}{t^4+1}dt=2\\cdot\\dfrac{\\pi}{2\\sqrt2}=\\dfrac{\\pi}{\\sqrt2}$. Coincidono."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"Taglio sul semiasse reale POSITIVO ($\\arg z\\in(0,2\\pi)$, contorno keyhole) contro taglio sul semiasse NEGATIVO ($\\arg z\\in(-\\pi,\\pi)$): la differenza operativa e'","opts":[{"x":"col taglio positivo i due lati danno il fattore $(1-e^{2\\pi i\\alpha})$; col taglio negativo il lato $\\gamma_-$ porta $e^{i\\pi/2}=i$ e il bilancio e' $(1+i)I$","c":true},{"x":"nessuna: il risultato non dipende da dove si mette il taglio"},{"x":"col taglio negativo la funzione diventa monodroma"},{"x":"col taglio positivo non si possono usare i residui"}],"hint":"Il salto della determinazione fra i due lati dipende da DOVE passa il taglio: e' $e^{2\\pi i\\alpha}$ per il keyhole classico, e' $e^{i\\pi/2}=i$ (per $\\sqrt z$) col taglio negativo.","sol":"<b>Taglio positivo vs negativo (20240703 vs 20241106).</b> Il valore dell'integrale e' lo stesso, ma il MECCANISMO cambia con la posizione del taglio: keyhole positivo $\\Rightarrow (1-e^{2\\pi i\\alpha})I=2\\pi i\\sum\\mathrm{Res}$; taglio negativo con semicerchio $\\Rightarrow$ contributo $\\gamma_-$ pari a $iI$. Scegliere il taglio e' scegliere la forma dell'equazione risolvente."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"MODUS OPERANDI. Come si sceglie il contorno di integrazione per una polidroma su $[a,b]$ o $[0,\\infty)$?","opts":[{"x":"taglio su segmento finito con estremi = punti di diramazione &rarr; contorno 'a osso di cane' attorno al segmento; branch point in $0$ con integrale su $[0,\\infty)$ &rarr; keyhole (o semicerchio + asse, se il taglio e' negativo)","c":true},{"x":"sempre la semicirconferenza superiore, come per le razionali"},{"x":"sempre il cerchio unitario $z=e^{i\\theta}$"},{"x":"sempre un rettangolo con lato a $y=\\pi$"}],"hint":"Il contorno segue il taglio: circonda un segmento finito 'ad osso di cane', oppure aggira un branch point sul bordo del dominio con il buco della serratura.","sol":"<b>Scelta del contorno (nucleo 13).</b> La regola: il contorno deve circondare il taglio SENZA attraversarlo. Segmento $[a,b]$ &rarr; osso di cane (20230620, 20231116); branch point in $0$ con $[0,\\infty)$ &rarr; keyhole (20240703) o semicerchio+asse col taglio negativo (20241106). Riconoscere la geometria del taglio E' scegliere il contorno."}]},{"pool":"polidrome","src":"20230908 Es.2","steps":[{"t":"La funzione $z^i$ (con $\\log$ a un ramo fissato) e':","opts":[{"x":"$z^i=e^{i\\log z}=e^{i(\\ln|z|+i\\arg z)}=e^{-\\arg z}\\,e^{i\\ln|z|}$: infiniti valori, uno per ramo di $\\log$","c":true},{"x":"una funzione monodroma su $\\mathbb{C}\\setminus\\{0\\}$"},{"x":"sempre reale"},{"x":"un polinomio di grado $i$"}],"hint":"$z^\\alpha:=e^{\\alpha\\log z}$; con $\\alpha=i$ la parte $e^{-\\arg z}$ e' un modulo che cambia col ramo scelto.","sol":"<b>Potenza complessa (nucleo 11).</b> $z^i=e^{i\\log z}$; poich&eacute; $\\log z=\\ln|z|+i(\\arg z+2k\\pi)$, si ha $z^i=e^{-\\arg z-2k\\pi}e^{i\\ln|z|}$: infiniti valori (esponente non intero). Il MODULO $e^{-\\arg z}$ dipende dall'argomento, non solo dalla distanza: e' la novit&agrave; delle potenze immaginarie. Fissato il taglio, si sceglie un ramo e si lavora l&igrave;."}]},{"pool":"polidrome","src":"20230908 Es.2","steps":[{"t":"$f(z)=\\dfrac{z^i}{1+z^3}$, taglio sull'asse reale positivo, determinazione con $f(1)=1/2$ sopra il taglio ($\\arg z\\in(0,2\\pi)$). Per calcolare $f(-2)$: quanto vale $\\log(-2)$ su questo foglio?","opts":[{"x":"$\\log(-2)=\\ln 2+i\\pi$ (perch&eacute; $\\arg(-2)=\\pi$)","c":true},{"x":"$\\log(-2)=\\ln 2-i\\pi$"},{"x":"$\\log(-2)=\\ln 2$"},{"x":"$\\log(-2)=i\\pi$"}],"hint":"Con taglio sul semiasse positivo e $\\arg\\in(0,2\\pi)$, il punto $-2$ sta sul semiasse negativo: $\\arg(-2)=\\pi$.","sol":"<b>Logaritmo sul foglio dato (soluzione 08/09/2023).</b> Con $\\arg z\\in(0,2\\pi)$, $-2=2e^{i\\pi}$ ha $\\arg=\\pi$, quindi $\\log(-2)=\\ln2+i\\pi$. Prendere $-i\\pi$ (abitudine dalla determinazione principale) e' l'errore tipico: il ramo qui non e' quello principale.","cont":"Ora componi $f(-2)$ &rarr;"},{"t":"Con $\\log(-2)=\\ln2+i\\pi$ e $1+(-2)^3=1-8=-7$, quanto vale $f(-2)$?","opts":[{"x":"$f(-2)=-\\dfrac{e^{-\\pi}\\,e^{i\\ln2}}{7}$","c":true},{"x":"$f(-2)=\\dfrac{e^{\\pi}\\,e^{i\\ln2}}{7}$"},{"x":"$f(-2)=-\\dfrac{e^{-\\pi}}{7}$"},{"x":"$f(-2)=\\dfrac{e^{-\\pi}\\,e^{-i\\ln2}}{7}$"}],"hint":"$(-2)^i=e^{i\\log(-2)}=e^{i(\\ln2+i\\pi)}=e^{-\\pi}e^{i\\ln2}$; poi dividi per $1+(-2)^3=-7$.","sol":"<b>Valore composto (soluzione ufficiale).</b> $(-2)^i=e^{i(\\ln2+i\\pi)}=e^{-\\pi}\\,e^{i\\ln2}$; e $1+(-2)^3=-7$. Dunque $f(-2)=-\\dfrac{e^{-\\pi}e^{i\\ln2}}{7}$. La parte $e^{-\\pi}$ (modulo) viene dall'argomento $\\pi$, la fase $e^{i\\ln2}$ dal modulo $2$: tipico intreccio delle potenze immaginarie."}]},{"pool":"polidrome","src":"20230908 Es.2","steps":[{"t":"Sempre $f(z)=\\dfrac{z^i}{1+z^3}$ sul foglio $\\arg z\\in(0,2\\pi)$: $\\mathrm{Res}_{z=-1}f$ vale (nota $-1=e^{i\\pi}$, polo semplice):","opts":[{"x":"$\\dfrac{e^{-\\pi}}{3}$","c":true},{"x":"$\\dfrac{e^{\\pi}}{3}$"},{"x":"$-\\dfrac{e^{-\\pi}}{3}$"},{"x":"$\\dfrac{e^{-\\pi}}{3}\\,e^{i\\pi}$"}],"hint":"Formula del quoziente: $\\mathrm{Res}=\\dfrac{(-1)^i}{3z^2}\\big|_{z=-1}=\\dfrac{(-1)^i}{3}$, con $(-1)^i=e^{i\\log(-1)}=e^{i(i\\pi)}=e^{-\\pi}$.","sol":"<b>Residuo con potenza polidroma (soluzione ufficiale: $e^{-\\pi}/3$).</b> $z=-1$ e' polo semplice di $1/(1+z^3)$ con $Q'=3z^2$; $Q'(-1)=3$. Numeratore $(-1)^i=e^{i\\log(-1)}=e^{i\\cdot i\\pi}=e^{-\\pi}$ (su questo foglio $\\arg(-1)=\\pi$). Quindi $\\mathrm{Res}_{z=-1}=\\dfrac{e^{-\\pi}}{3}$. Il valore del numeratore dipende dal foglio: e' l&igrave; che serve coerenza con il taglio scelto."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"Nel keyhole per $\\int_0^\\infty x^{\\alpha-1}g(x)\\,dx$ (con $g$ razionale), il fattore davanti all'integrale e' $(1-e^{2\\pi i\\alpha})$ perch&eacute;:","opts":[{"x":"sopra il taglio l'integrando vale $x^{\\alpha-1}g$, sotto vale $x^{\\alpha-1}e^{2\\pi i\\alpha}g$: la differenza dei due lati e' $(1-e^{2\\pi i\\alpha})\\int_0^\\infty$","c":true},{"x":"e' un fattore di normalizzazione arbitrario"},{"x":"viene dal residuo all'infinito"},{"x":"e' il salto di $g$, non di $x^{\\alpha-1}$"}],"hint":"Girando sotto il taglio, $\\arg z$ passa da $0$ a $2\\pi$, quindi $z^{\\alpha-1}$ acquista $e^{2\\pi i(\\alpha-1)}=e^{2\\pi i\\alpha}$.","sol":"<b>Fattore keyhole (nucleo 13, sottotipo D).</b> Sopra: $\\arg z=0$, integrando $=x^{\\alpha-1}g(x)$. Sotto: $\\arg z=2\\pi$, integrando $=x^{\\alpha-1}e^{2\\pi i\\alpha}g(x)$. Sommando i due lati (verso opposto) resta $(1-e^{2\\pi i\\alpha})\\int_0^\\infty x^{\\alpha-1}g\\,dx=2\\pi i\\sum\\mathrm{Res}$. Se la funzione fosse monodroma ($\\alpha$ intero), $e^{2\\pi i\\alpha}=1$ e i due lati si cancellerebbero: $0=0$."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"Nel keyhole per $\\int_0^\\infty \\dfrac{x^{\\alpha-1}}{1+x}dx$, gli archi $C_R$ e $C_\\varepsilon$ svaniscono a patto che:","opts":[{"x":"$0<\\alpha<1$: la stessa condizione che rende convergente l'integrale reale","c":true},{"x":"$\\alpha>1$ soltanto"},{"x":"$\\alpha$ sia intero"},{"x":"$\\alpha<0$"}],"hint":"$C_R$ svanisce se $x^{\\alpha-1}/(1+x)\\to0$ pi&ugrave; in fretta di $1/R$ ($\\alpha<1$); $C_\\varepsilon$ svanisce se l'integrando non esplode in $0$ ($\\alpha>0$).","sol":"<b>Convergenza e svanimento coincidono (nucleo 13).</b> $C_R$ ($R\\to\\infty$) svanisce per $\\alpha<1$, $C_\\varepsilon$ ($\\varepsilon\\to0$) per $\\alpha>0$: insieme, $0<\\alpha<1$. E' esattamente l'intervallo in cui $\\int_0^\\infty x^{\\alpha-1}/(1+x)\\,dx$ converge: non un caso, la stima ML e la convergenza reale sono la stessa richiesta. Il risultato e' $\\pi/\\sin\\pi\\alpha$ (formula di riflessione, nucleo 14)."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"Per $f(z)=(z^2-1)^{1/2}$ con taglio sul SEGMENTO $[-1,1]$, il punto $z=\\infty$ e':","opts":[{"x":"NON un punto di diramazione: fuori dal segmento la funzione e' monodroma, e all'infinito $f(z)\\sim z$ (comportamento regolare a un valore)","c":true},{"x":"un punto di diramazione, sempre"},{"x":"un polo doppio"},{"x":"una singolarita' essenziale"}],"hint":"Con il taglio sul segmento, un cammino grande che avvolge tutto $[-1,1]$ avvolge ENTRAMBE le diramazioni: i due segni si compensano e la funzione ritorna al valore iniziale.","sol":"<b>Diramazione all'infinito (nucleo 11).</b> Con taglio su $[-1,1]$, un giro attorno a $\\infty$ avvolge entrambi i punti $\\pm1$: fattore $(-1)^2=+1$, monodroma. All'infinito $f\\sim z$: nessuna diramazione. Con i tagli ESTERNI, invece, $\\infty$ e' interno alla regione fra i due tagli e il conteggio cambia. Se $\\infty$ e' regolare, il residuo all'infinito e' comunque ben definito ed e' lo strumento chiave (20231116)."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"Quante determinazioni (fogli) hanno $\\sqrt{z}$ e $\\log z$?","opts":[{"x":"$\\sqrt z$ ne ha DUE (due giri riportano al valore iniziale); $\\log z$ ne ha INFINITE (ogni giro aggiunge $2\\pi i$)","c":true},{"x":"entrambe infinite"},{"x":"entrambe due"},{"x":"$\\sqrt z$ infinite, $\\log z$ due"}],"hint":"$\\sqrt z=e^{\\frac12\\log z}$: due giri fanno crescere $\\arg z$ di $4\\pi$, la mezza-potenza di $2\\pi$, e $e^{i2\\pi/2}=e^{i\\pi}$... controlla con cura quanti giri riportano al valore.","sol":"<b>Numero di fogli (nucleo 11).</b> $z^{p/q}$ ha $q$ determinazioni: $\\sqrt z=z^{1/2}$ ne ha $2$ (dopo due giri $\\arg$ cresce di $4\\pi$, la mezza-potenza di $2\\pi$: $e^{i2\\pi}=1$, si torna). $\\log z$ ha infinite (esponente non razionale del meccanismo: ogni giro aggiunge $2\\pi i$, mai periodico). E' la ragione geometrica per cui la superficie di Riemann di $\\sqrt z$ ha due fogli e quella di $\\log z$ infiniti."}]},{"pool":"polidrome","src":"20230704 Es.1","steps":[{"t":"$f(z)=\\dfrac{z+2}{(z-2)(1-z^2)^{1/2}}$, taglio $[-1,1]$, $(1-z^2)^{1/2}$ reale positiva sopra il taglio. Per $\\mathrm{Res}_{z=2}f$ serve il valore di $(1-z^2)^{1/2}$ in $z=2$. Con la determinazione data vale:","opts":[{"x":"$(1-4)^{1/2}=\\sqrt{-3}=-i\\sqrt3$ sul foglio scelto (non $+i\\sqrt3$)","c":true},{"x":"$+i\\sqrt3$"},{"x":"$\\sqrt3$ (reale)"},{"x":"$-\\sqrt3$ (reale)"}],"hint":"Il valore della radice in $z=2$ va trasportato con continuit&agrave; dal taglio: NON si sceglie il segno a piacere. La soluzione ufficiale trova $-i\\sqrt3$.","sol":"<b>Valore del ramo fuori dal taglio (soluzione 04/07/2023).</b> $(1-z^2)^{1/2}$ in $z=2$ vale $-i\\sqrt3$ con la determinazione fissata sopra $[-1,1]$: il segno si ottiene tracciando gli angoli dei fattori $(1-z)^{1/2}(1+z)^{1/2}$ da $z=2$, non per scelta. Sbagliare il segno di UN fattore (trappola b01) inverte il residuo.","cont":"Ora il residuo &rarr;"},{"t":"Con $(1-z^2)^{1/2}\\big|_{z=2}=-i\\sqrt3$, il residuo nel polo semplice $z=2$ e':","opts":[{"x":"$\\mathrm{Res}_{z=2}f=\\dfrac{z+2}{(1-z^2)^{1/2}}\\Big|_{2}=\\dfrac{4}{-i\\sqrt3}=\\dfrac{4i}{\\sqrt3}$","c":true},{"x":"$\\dfrac{4}{i\\sqrt3}=-\\dfrac{4i}{\\sqrt3}$"},{"x":"$\\dfrac{4}{\\sqrt3}$"},{"x":"$\\dfrac{4}{-\\sqrt3}$"}],"hint":"Polo semplice da $(z-2)$: $\\mathrm{Res}=\\lim_{z\\to2}(z-2)f=\\dfrac{z+2}{(1-z^2)^{1/2}}\\big|_{2}$; poi $1/(-i)=i$.","sol":"<b>Residuo in $z=2$ (nucleo 13, polo semplice).</b> $\\mathrm{Res}_{z=2}=\\dfrac{2+2}{-i\\sqrt3}=\\dfrac{4}{-i\\sqrt3}=\\dfrac{4i}{\\sqrt3}$ (moltiplicando per $i/i$: $1/(-i)=i$). Questo residuo, insieme a $\\mathrm{Res}_\\infty$, entra nel calcolo di $\\int_{-1}^1\\dfrac{x+2}{(x-2)\\sqrt{1-x^2}}dx=\\pi(1-4/\\sqrt3)$ (risultato negativo, coerente con l'integrando negativo su $(-1,1)$)."}]},{"pool":"polidrome","src":"20240703 Es.2","steps":[{"t":"$\\int_0^\\infty\\dfrac{x+1}{\\sqrt{x}\\,(x^2-2x+2)}dx$: branch point in $0$ (taglio semiasse positivo, $\\theta\\in[0,2\\pi)$), poli in $z=1\\pm i$. Nel keyhole, sotto il taglio $\\sqrt z=\\sqrt{x}\\,e^{i\\pi}=-\\sqrt x$. Perch&eacute; il tratto $\\gamma_-$ d&agrave; $+I$ e non $-I$?","opts":[{"x":"perch&eacute; $\\sqrt z$ cambia di $-1$ MA anche il verso di percorrenza e' invertito: $(-1)\\cdot(-1)=+1$, i due effetti si combinano","c":true},{"x":"perch&eacute; sotto il taglio $\\sqrt z=+\\sqrt x$, identico a sopra"},{"x":"perch&eacute; il polo $1+i$ e' sotto il taglio"},{"x":"perch&eacute; l'integrando e' pari"}],"hint":"Due segni si moltiplicano: quello della determinazione ($\\sqrt z\\to-\\sqrt x$) e quello del verso ($dx\\to-dx$). Sbagliarne UNO d&agrave; $0=2I$.","sol":"<b>Il verso di $\\gamma_-$ (trappola dichiarata, soluzione 03/07/2024).</b> Sotto il taglio $1/\\sqrt z\\to-1/\\sqrt x$; ma $\\gamma_-$ e' percorso da $R$ verso $\\varepsilon$, cio&egrave; $-dx$. Il prodotto $(-1)(-1)=+1$: il tratto d&agrave; $+I$, e il bilancio e' $2I=2\\pi i(\\mathrm{Res}_{1+i}+\\mathrm{Res}_{1-i})$. Chi inverte UNO dei due segni ottiene $0=2I$, assurdo: e' l'errore n.2 di b01 (segno dal verso del contorno).","cont":"Ora individua i poli interni &rarr;"},{"t":"Quali poli entrano nel bilancio $2I=2\\pi i\\sum\\mathrm{Res}$?","opts":[{"x":"ENTRAMBI $z=1+i$ e $z=1-i$: il contorno keyhole racchiude tutto il piano tranne il taglio, quindi tutti i poli finiti","c":true},{"x":"solo $z=1+i$ (semipiano superiore)"},{"x":"solo $z=1-i$ (semipiano inferiore)"},{"x":"nessuno: il contorno non racchiude poli"}],"hint":"Il keyhole, chiuso da $C_R$ e $C_\\varepsilon$, racchiude l'intero piano meno il taglio: ogni polo che non sta sul semiasse positivo e' interno.","sol":"<b>Poli interni al keyhole (nucleo 13).</b> Il contorno a buco della serratura racchiude tutto il piano eccetto il semiasse positivo (il taglio): entrambi $1\\pm i$ sono interni. Da qui $2I=2\\pi i(\\mathrm{Res}_{1+i}+\\mathrm{Res}_{1-i})$. Differenza col sottotipo (c) di Jordan, dove invece si sceglie un solo semipiano: qui la geometria del taglio impone di prendere tutti i poli finiti."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"MODUS OPERANDI. Come riconosci a colpo d'occhio che un integrale e' del tipo 'polidromo' e non un altro sottotipo di residui?","opts":[{"x":"compare una potenza NON intera ($\\sqrt{\\cdot}$, $x^\\alpha$, $z^i$) o un $\\log$: l'integrando e' polidromo, serve un taglio e un contorno che lo circonda","c":true},{"x":"quando l'integrale e' su $[0,2\\pi]$: si usa $z=e^{i\\theta}$"},{"x":"quando compare $e^{ikx}$: si usa il lemma di Jordan"},{"x":"quando il denominatore ha grado alto: semicerchio superiore"}],"hint":"La spia e' l'esponente frazionario o il logaritmo. Le razionali pure, i $\\cos/\\sin$ e gli $e^{ikx}$ appartengono agli altri tre sottotipi.","sol":"<b>Riconoscimento del tipo (nucleo 13).</b> Quattro sottotipi: (a) razionali su $\\mathbb R$ &rarr; semicerchio; (b) razionali in $\\cos,\\sin$ &rarr; $z=e^{i\\theta}$; (c) con $e^{ikx}$ &rarr; Jordan; (d) con TAGLI ($x^\\alpha$, $\\log$, $\\sqrt{\\cdot}$) &rarr; keyhole/osso di cane. La presenza di una potenza non intera o di un logaritmo e' la firma del sottotipo (d): prima si fissa il taglio, poi si sceglie il contorno."}]},{"pool":"polidrome","src":"20230908 Es.2","steps":[{"t":"Ancora $f(z)=\\dfrac{z^i}{1+z^3}$ sul foglio $\\arg z\\in(0,2\\pi)$: per $f(-i)$, con $\\arg(-i)=3\\pi/2$, quanto vale $(-i)^i$?","opts":[{"x":"$(-i)^i=e^{i\\log(-i)}=e^{i(i\\,3\\pi/2)}=e^{-3\\pi/2}$","c":true},{"x":"$(-i)^i=e^{\\pi/2}$"},{"x":"$(-i)^i=e^{-\\pi/2}$"},{"x":"$(-i)^i=e^{3\\pi/2}$"}],"hint":"$\\log(-i)=\\ln1+i\\arg(-i)=i\\,\\tfrac{3\\pi}{2}$ su questo foglio; poi $(-i)^i=e^{i\\log(-i)}=e^{i\\cdot i\\,3\\pi/2}$.","sol":"<b>Potenza immaginaria sul foglio (soluzione 08/09/2023).</b> Con $\\arg z\\in(0,2\\pi)$, $\\arg(-i)=3\\pi/2$ (NON $-\\pi/2$: e' l'errore del foglio principale). $\\log(-i)=i\\,3\\pi/2$, quindi $(-i)^i=e^{i(i3\\pi/2)}=e^{-3\\pi/2}$, reale positivo.","cont":"Ora componi $f(-i)$ &rarr;"},{"t":"Con $(-i)^i=e^{-3\\pi/2}$ e $1+(-i)^3=1+i$ (poich&eacute; $(-i)^3=i$), quanto vale $f(-i)$?","opts":[{"x":"$f(-i)=\\dfrac{e^{-3\\pi/2}}{1+i}$","c":true},{"x":"$f(-i)=\\dfrac{e^{-3\\pi/2}}{1-i}$"},{"x":"$f(-i)=\\dfrac{e^{-3\\pi/2}}{2}$"},{"x":"$f(-i)=e^{-3\\pi/2}(1+i)$"}],"hint":"$(-i)^3=(-i)(-i)(-i)$: $(-i)^2=-1$, poi $\\times(-i)=i$. Quindi $1+(-i)^3=1+i$.","sol":"<b>Valore composto (soluzione ufficiale).</b> $(-i)^3=i$, dunque $1+(-i)^3=1+i$; e $(-i)^i=e^{-3\\pi/2}$. Perci&ograve; $f(-i)=\\dfrac{e^{-3\\pi/2}}{1+i}$. Il modulo $e^{-3\\pi/2}$ registra l'argomento $3\\pi/2$: un piccolo cambio di foglio (se avessi usato $\\arg=-\\pi/2$) darebbe $e^{\\pi/2}$, valore completamente diverso."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"Perch&eacute; il contorno keyhole 'funziona' (d&agrave; un risultato non banale) solo per funzioni polidrome?","opts":[{"x":"perch&eacute; solo se la funzione cambia determinazione fra i due lati del taglio i tratti non si cancellano; per una funzione monodroma darebbero $0=0$","c":true},{"x":"perch&eacute; le monodrome non hanno residui"},{"x":"perch&eacute; il taglio esiste solo per le monodrome"},{"x":"perch&eacute; l'arco $C_R$ non svanisce per le monodrome"}],"hint":"I due lati del taglio sono lo stesso segmento percorso avanti e indietro: se la funzione ha lo stesso valore su entrambi, i contributi si annullano.","sol":"<b>Il meccanismo del taglio (nucleo 13, sottotipo D).</b> Geometricamente i due lati coincidono col semiasse, percorsi in verso opposto. Per una funzione MONODROMA il valore e' identico e i tratti si cancellano: $0=0$, nessuna informazione. Per una POLIDROMA il valore differisce di un fattore ($e^{2\\pi i\\alpha}$, o un segno per $\\sqrt{\\cdot}$), e la loro somma e' proporzionale a $\\int_0^\\infty f$: e' la polidromia stessa a produrre il calcolo. Questa e' la ragione profonda per cui il tipo esiste."}]},{"pool":"polidrome","src":"tipo b01","steps":[{"t":"CHECKLIST finale del tipo 'polidroma': l'ordine dei controlli prima di consegnare e'","opts":[{"x":"(1) diramazioni e taglio dichiarati; (2) determinazione fissata dal dato reale-positivo; (3) angoli trasportati attorno al punto e nel verso giusti; (4) valori verificati; (5) verso del contorno esplicitato nel segno di $I$; (6) controllo di plausibilita' (reale? positivo?)","c":true},{"x":"basta calcolare i residui e moltiplicare per $2\\pi i$"},{"x":"basta scegliere la semicirconferenza superiore"},{"x":"basta sostituire $z=e^{i\\theta}$"}],"hint":"Le due trappole di b01 (angolo di un fattore, verso del contorno) stanno ai passi 3 e 5: sono l&igrave; i controlli che salvano l'esercizio.","sol":"<b>Sintesi operativa (b01 + nuclei 11, 13).</b> La checklist mette al passo 3 la trappola dell'angolo di un solo fattore, e al passo 5 quella del segno dal verso del contorno: sono gli errori censiti negli scritti. Il passo 6 (plausibilita': un integrale di funzione reale positiva DEVE uscire reale e positivo) e' il controllo finale gratuito che smaschera un segno sbagliato. Chi svolge questi sei passi non 'riconosce' la risposta: la COSTRUISCE."}]}],"matrici":[{"pool":"matrici","src":"nucleo 16 &middot; b01","steps":[{"t":"<b>Teorema spettrale.</b> Per un operatore $A$ autoaggiunto ($A=A^{\\dagger}$) su spazio di dimensione finita vale:","opts":[{"x":"esiste una base ORTONORMALE di autovettori, gli autovalori sono REALI e $A=\\sum_k\\lambda_k P_k$ con $P_k=|v_k\\rangle\\langle v_k|$","c":true},{"x":"gli autovalori sono reali ma la base di autovettori non &egrave; mai ortogonale"},{"x":"$A$ &egrave; sempre diagonalizzabile ma con autovalori complessi"},{"x":"$A$ ammette forma di Jordan non banale"}],"hint":"Autoaggiunto forza DUE cose insieme: spettro reale e base ortonormale di autovettori. Da qui i proiettori sono i prodotti esterni.","sol":"<b>Teorema spettrale.</b> Se $A=A^{\\dagger}$ allora $A$ &egrave; diagonalizzabile con autovalori reali e una base ortonormale $\\{v_k\\}$ di autovettori: $A=\\sum_k\\lambda_k P_k$, $P_k=|v_k\\rangle\\langle v_k|$, con $P_kP_j=\\delta_{kj}P_k$ e $\\sum_k P_k=\\mathbb{1}$. L'ortonormalit&agrave; degli autovettori &egrave; ci&ograve; che rende leciti i proiettori come prodotti esterni; senza autoaggiuntezza questa scorciatoia salta (tappa 02 del nucleo 16)."}]},{"pool":"matrici","src":"tipo &middot; nucleo 16","steps":[{"t":"Una matrice $A$ &egrave; DIAGONALIZZABILE se e solo se, per ogni autovalore:","opts":[{"x":"la molteplicit&agrave; geometrica (dim dell'autospazio) UGUAGLIA quella algebrica (ordine come radice del caratteristico)","c":true},{"x":"la molteplicit&agrave; algebrica &egrave; $1$"},{"x":"gli autovalori sono tutti reali"},{"x":"la matrice &egrave; simmetrica"}],"hint":"Non serve che gli autovalori siano distinti: serve che ogni autospazio sia grande quanto la molteplicit&agrave; algebrica dell'autovalore.","sol":"<b>Criterio di diagonalizzabilit&agrave; (m.a.=m.g.).</b> $A$ &egrave; diagonalizzabile $\\iff$ per ogni autovalore $\\lambda$ la molteplicit&agrave; geometrica $\\dim\\ker(A-\\lambda\\mathbb{1})$ eguaglia quella algebrica. Autovalori distinti sono sufficienti ma non necessari; una matrice simmetrica (reale) o hermitiana lo &egrave; sempre per il teorema spettrale, ma esistono matrici diagonalizzabili non simmetriche."}]},{"pool":"matrici","src":"tipo &middot; b01","steps":[{"t":"MODUS OPERANDI. Davanti a &laquo;calcolare $f(A)$ per una matrice $A$ data&raquo;, come si riconosce il tipo e qual &egrave; il PRIMO passo:","opts":[{"x":"diagonalizzare $A$ (autovalori + autovettori) e controllare se gli autovettori sono ortonormali: decide QUALE formula per i proiettori usare","c":true},{"x":"applicare subito la serie di Taylor di $f$ alla matrice"},{"x":"calcolare $\\det A$ e $\\mathrm{tr}\\,A$"},{"x":"invertire $A$ e poi valutare $f$"}],"hint":"Tutto il metodo spettrale poggia sui proiettori; ma la loro forma dipende dall'ortonormalit&agrave; degli autovettori. Quella verifica va fatta per PRIMA.","sol":"<b>Strategia (rappresentazione spettrale).</b> Ordine invariante: (1) trova autovalori $\\lambda_k$ e autovettori $v_k$; (2) verifica se $\\{v_k\\}$ &egrave; ortonormale &mdash; automatico se $A$ &egrave; autoaggiunta/normale, da controllare altrimenti; (3) costruisci i proiettori $P_k$ (prodotto esterno se ortonormali, cambio di base $S E_{kk}S^{-1}$ se no); (4) $f(A)=\\sum_k f(\\lambda_k)P_k$. Il passo (2) &egrave; il bivio che separa la risposta giusta dalla trappola pi&ugrave; frequente dello scritto."}]},{"pool":"matrici","src":"tipo &middot; b03 Set 1","steps":[{"t":"Le tre propriet&agrave; che definiscono un insieme di proiettori spettrali $\\{P_k\\}$ sono:","opts":[{"x":"$P_k^2=P_k$ (idempotenza), $P_kP_j=0$ per $k\\neq j$ (ortogonalit&agrave;), $\\sum_k P_k=\\mathbb{1}$ (completezza)","c":true},{"x":"$P_k^2=\\mathbb{1}$, $\\det P_k=1$, $\\mathrm{tr}\\,P_k=0$"},{"x":"$P_k=P_k^{\\dagger}$ e $\\det P_k\\neq0$"},{"x":"$P_kP_j=P_j$ per ogni $k,j$"}],"hint":"Idempotenza, ortogonalit&agrave; reciproca e risoluzione dell'identit&agrave;: il controllo $\\sum P_k=\\mathbb{1}$ smaschera quasi ogni errore.","sol":"<b>Definizione di proiettore spettrale.</b> $P_k^2=P_k$, $P_kP_j=\\delta_{kj}P_k$, $\\sum_k P_k=\\mathbb{1}$. Da queste segue $A=\\sum_k\\lambda_k P_k$ e $f(A)=\\sum_k f(\\lambda_k)P_k$. Nota: la simmetria $P_k=P_k^{\\dagger}$ vale SOLO se gli autovettori sono ortonormali; per autovettori non ortogonali i proiettori sono obliqui ($P_k\\neq P_k^{\\dagger}$) ma restano idempotenti e completi."}]},{"pool":"matrici","src":"20240618 Es.3 &middot; nucleo 16","steps":[{"t":"TRAPPOLA n.2 (segnalata negli scritti). Se gli autovettori NON sono ortonormali, il proiettore $P_k$:","opts":[{"x":"NON &egrave; $|v_k\\rangle\\langle v_k|$; si costruisce come $P_k=S\\,E_{kk}\\,S^{-1}$, con $S=[v_1\\,v_2\\,\\dots]$ e $E_{kk}$ la matrice $1$ nel posto $(k,k)$","c":true},{"x":"&egrave; comunque $|v_k\\rangle\\langle v_k|$, normalizzando $v_k$"},{"x":"non esiste: la matrice non &egrave; diagonalizzabile"},{"x":"&egrave; $|v_k\\rangle\\langle v_k|/\\det S$"}],"hint":"Con autovettori obliqui, $|v_k\\rangle\\langle v_k|$ non &egrave; nemmeno idempotente nella direzione giusta e $\\sum_k|v_k\\rangle\\langle v_k|\\neq\\mathbb{1}$. Serve la base duale (righe di $S^{-1}$).","sol":"<b>Proiettori con autovettori non ortonormali.</b> La formula $|v_k\\rangle\\langle v_k|$ vale solo per basi ortonormali. In generale $P_k=S\\,E_{kk}\\,S^{-1}=|v_k\\rangle\\langle w_k|$, dove $\\{w_k\\}$ &egrave; la base DUALE (biortogonale), cio&egrave; le righe di $S^{-1}$, con $\\langle w_i,v_j\\rangle=\\delta_{ij}$. Sono proiettori OBLIQUI. &Egrave; l'errore n.2 del nucleo 16 e la trappola dell'Es.3 del 18/06/2024."}]},{"pool":"matrici","src":"20241106 Es.3","steps":[{"t":"Se gli autovettori $e^{(k)}$ sono ortonormali ma COMPLESSI ($e^{(i)}\\cdot(e^{(j)})^{*}=\\delta_{ij}$), il proiettore $P_k$ ha componenti:","opts":[{"x":"$(P_k)_{jl}=e^{(k)}_j\\,(e^{(k)}_l)^{*}$ &mdash; con il CONIUGATO sull'indice di sinistra","c":true},{"x":"$(P_k)_{jl}=e^{(k)}_j\\,e^{(k)}_l$ senza coniugio"},{"x":"$(P_k)_{jl}=(e^{(k)}_j)^{*}\\,(e^{(k)}_l)^{*}$"},{"x":"$(P_k)_{jl}=\\mathrm{Re}\\big(e^{(k)}_j e^{(k)}_l\\big)$"}],"hint":"Il prodotto scalare hermitiano coniuga il fattore bra: $\\langle v|$ porta $(e_l)^{*}$. Senza coniugio $P_k$ non &egrave; idempotente e $\\sum P_k\\neq\\mathbb{1}$.","sol":"<b>Proiettori con autovettori complessi (compito 06/11/2024).</b> Nel prodotto scalare hermitiano $P_k=|e^{(k)}\\rangle\\langle e^{(k)}|$ significa $(P_k)_{jl}=e^{(k)}_j(e^{(k)}_l)^{*}$: il bra porta il coniugato. Dimenticare il $*$ &egrave; la trappola segnalata &mdash; produce una matrice che non soddisfa $P_k^2=P_k$. La struttura discende dalla <b>definizione di prodotto scalare hermitiano</b> $\\langle u,v\\rangle=\\sum_j u_j^{*}v_j$."}]},{"pool":"matrici","src":"tipo &middot; nucleo 16","steps":[{"t":"Il senso della formula $f(A)=\\sum_k f(\\lambda_k)P_k$ &egrave;:","opts":[{"x":"nella base spettrale ogni funzione dell'operatore agisce numero per numero: si valuta $f$ sugli AUTOVALORI, non sulla matrice","c":true},{"x":"si sostituisce $A$ dentro la serie di Taylor di $f$ e si somma la serie di matrici"},{"x":"si calcola $f$ della traccia di $A$"},{"x":"vale solo per $f$ polinomio"}],"hint":"Diagonalizzare &egrave; disaccoppiare: sui modi propri $A$ &egrave; un numero, e $f$ agisce su quel numero.","sol":"<b>Funzioni di operatore (teorema spettrale).</b> Se $A=\\sum_k\\lambda_k P_k$ allora $f(A):=\\sum_k f(\\lambda_k)P_k$ per ogni $f$ definita sullo spettro. Non c'&egrave; nessuna serie di matrici da sommare: $e^{A}$, $\\log A$, $A^{1/2}$, $\\cos(A)$ si ottengono valutando $f$ sui singoli $\\lambda_k$. La definizione coincide con la serie di Taylor quando questa converge, ma vale anche per $\\log$, radici, ecc., dove la serie non aiuta."}]},{"pool":"matrici","src":"tipo &middot; b01","steps":[{"t":"MODUS OPERANDI. Per calcolare $f(A^2)$ (es. $e^{A^2}$) con $A=\\sum_k\\lambda_kP_k$, l'ordine corretto delle operazioni &egrave;:","opts":[{"x":"prima elevare gli autovalori: $A^2=\\sum_k\\lambda_k^2 P_k$, poi $f(A^2)=\\sum_k f(\\lambda_k^2)P_k$","c":true},{"x":"calcolare $f(A)=\\sum_k f(\\lambda_k)P_k$ e poi elevarlo al quadrato"},{"x":"calcolare $\\big(f(A)\\big)^2$"},{"x":"valutare $f$ su $\\lambda_k$ e poi elevare la matrice al quadrato"}],"hint":"L'argomento della funzione &egrave; $A^2$, non $A$: sui modi propri l'autovalore che entra in $f$ &egrave; $\\lambda_k^2$.","sol":"<b>Composizione di funzioni sullo spettro (trappola del 08/09/2023).</b> $A$ e $A^2$ hanno gli STESSI proiettori $P_k$; cambiano gli autovalori: $A^2=\\sum_k\\lambda_k^2P_k$. Quindi $f(A^2)=\\sum_k f(\\lambda_k^2)P_k$ &mdash; si valuta $f$ su $\\lambda_k^2$. Confondere $f(A^2)$ con $f(A^2)$ mal ordinato (elevare dopo aver applicato $f$) &egrave; l'errore tipico: per esempio $e^{A^2}$ usa $e^{\\lambda_k^2}$, non $(e^{\\lambda_k})^2$."}]},{"pool":"matrici","src":"nucleo 16 &middot; b03 Set 1","steps":[{"t":"Sia $A=\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$. Autovalori e natura degli autovettori:","opts":[{"x":"$\\lambda=1,3$; autovettori $\\tfrac{1}{\\sqrt2}\\binom{1}{-1}$ e $\\tfrac{1}{\\sqrt2}\\binom{1}{1}$, ORTONORMALI (matrice simmetrica)","c":true},{"x":"$\\lambda=1,3$; autovettori non ortogonali"},{"x":"$\\lambda=2,2$; matrice non diagonalizzabile"},{"x":"$\\lambda=\\pm1$; autovettori complessi"}],"hint":"$\\det(A-\\lambda\\mathbb{1})=(2-\\lambda)^2-1$. La matrice &egrave; reale simmetrica: il teorema spettrale garantisce autovettori ortogonali.","sol":"<b>Diagonalizzazione (caso simmetrico).</b> $(2-\\lambda)^2-1=0\\Rightarrow\\lambda=1,3$. Per $\\lambda=1$: $v_1\\propto(1,-1)$; per $\\lambda=3$: $v_3\\propto(1,1)$. Ortogonali per il <b>teorema spettrale</b> (matrice reale simmetrica), normalizzati con $1/\\sqrt2$.","cont":"Costruisci i proiettori e $e^{A}$ &rarr;"},{"t":"I proiettori e $e^{A}$ valgono:","opts":[{"x":"$P_1=\\tfrac12\\begin{pmatrix}1&-1\\\\-1&1\\end{pmatrix}$, $P_3=\\tfrac12\\begin{pmatrix}1&1\\\\1&1\\end{pmatrix}$, $e^{A}=\\tfrac12\\begin{pmatrix}e+e^3&e^3-e\\\\e^3-e&e+e^3\\end{pmatrix}$","c":true},{"x":"$e^{A}=\\begin{pmatrix}e^2&e\\\\e&e^2\\end{pmatrix}$"},{"x":"$e^{A}=e^2\\begin{pmatrix}1&1\\\\1&1\\end{pmatrix}$"},{"x":"$e^{A}=\\tfrac12\\begin{pmatrix}e+e^3&e-e^3\\\\e-e^3&e+e^3\\end{pmatrix}$"}],"hint":"$P_k=|v_k\\rangle\\langle v_k|$ (ortonormali), poi $e^{A}=e^{1}P_1+e^{3}P_3$. Nessuna serie da sommare.","sol":"<b>Esponenziale via spettro.</b> $P_1=v_1v_1^{T}=\\tfrac12\\begin{pmatrix}1&-1\\\\-1&1\\end{pmatrix}$, $P_3=\\tfrac12\\begin{pmatrix}1&1\\\\1&1\\end{pmatrix}$ (verificano $P_1+P_3=\\mathbb{1}$). Per il <b>teorema spettrale</b> $e^{A}=e^{1}P_1+e^{3}P_3=\\tfrac12\\begin{pmatrix}e+e^3&e^3-e\\\\e^3-e&e+e^3\\end{pmatrix}$. Le funzioni di operatore si calcolano sugli autovalori, non sommando la serie."}]},{"pool":"matrici","src":"nucleo 16","steps":[{"t":"Sia $B=\\begin{pmatrix}3&1\\\\0&2\\end{pmatrix}$ (triangolare, NON simmetrica). Autovalori e autovettori:","opts":[{"x":"$\\lambda=3,2$; $v_3=\\binom{1}{0}$, $v_2=\\binom{1}{-1}$: NON ortogonali ($\\langle v_3,v_2\\rangle=1$)","c":true},{"x":"$\\lambda=3,2$; autovettori ortonormali"},{"x":"$\\lambda=2,2$; non diagonalizzabile"},{"x":"$\\lambda=\\pm\\sqrt6$"}],"hint":"Matrice triangolare: gli autovalori sono sulla diagonale. Non &egrave; simmetrica, quindi non aspettarti ortogonalit&agrave;: verificala.","sol":"<b>Diagonalizzazione (caso non simmetrico).</b> Triangolare $\\Rightarrow\\lambda=3,2$ (diagonale). $v_3=\\binom{1}{0}$, $v_2=\\binom{1}{-1}$. $\\langle v_3,v_2\\rangle=1\\neq0$: non ortogonali. Il <b>teorema spettrale</b> non si applica (matrice non normale): la formula $|v\\rangle\\langle v|$ per i proiettori sarebbe sbagliata.","cont":"Costruisci i proiettori corretti &rarr;"},{"t":"Con $S=\\begin{pmatrix}1&1\\\\0&-1\\end{pmatrix}$, $S^{-1}=\\begin{pmatrix}1&1\\\\0&-1\\end{pmatrix}$, i proiettori spettrali sono:","opts":[{"x":"$P_3=\\begin{pmatrix}1&1\\\\0&0\\end{pmatrix}$, $P_2=\\begin{pmatrix}0&-1\\\\0&1\\end{pmatrix}$: obliqui, con $P_3+P_2=\\mathbb{1}$ e $3P_3+2P_2=B$","c":true},{"x":"$P_3=\\begin{pmatrix}1&0\\\\0&0\\end{pmatrix}$, $P_2=\\begin{pmatrix}0&0\\\\0&1\\end{pmatrix}$"},{"x":"$P_3=\\tfrac12\\begin{pmatrix}1&1\\\\1&1\\end{pmatrix}$"},{"x":"$P_3=\\begin{pmatrix}1&1\\\\1&1\\end{pmatrix}$"}],"hint":"$P_k=S E_{kk}S^{-1}$. Controlla sempre $P_3+P_2=\\mathbb{1}$ e la ricostruzione $3P_3+2P_2=B$.","sol":"<b>Proiettori obliqui (cambio di base).</b> $P_3=S\\,\\mathrm{diag}(1,0)\\,S^{-1}=\\begin{pmatrix}1&1\\\\0&0\\end{pmatrix}$, $P_2=\\begin{pmatrix}0&-1\\\\0&1\\end{pmatrix}$. Controlli: $P_3+P_2=\\mathbb{1}$ (completezza), $P_i^2=P_i$, $3P_3+2P_2=\\begin{pmatrix}3&1\\\\0&2\\end{pmatrix}=B$. Non sono simmetrici, ed &egrave; corretto: sono proiettori OBLIQUI. La formula $|v\\rangle\\langle v|$ avrebbe dato $\\begin{pmatrix}1&1\\\\1&1\\end{pmatrix}$, che non &egrave; nemmeno idempotente."}]},{"pool":"matrici","src":"20230908 Es.3","steps":[{"t":"Matrice $A$ $3\\times3$ con autovettori ortonormali e autovalori $\\lambda_1=1$, $\\lambda_2=i$, $\\lambda_3=1-i$. Per calcolare $e^{A^2}$, gli autovalori di $A^2$ sono:","opts":[{"x":"$\\lambda_1^2=1$, $\\lambda_2^2=-1$, $\\lambda_3^2=(1-i)^2=-2i$","c":true},{"x":"$1$, $i$, $1-i$ (invariati)"},{"x":"$1$, $-i$, $-2i$"},{"x":"$e$, $e^i$, $e^{1-i}$"}],"hint":"$A^2=\\sum_k\\lambda_k^2 P_k$: eleva al quadrato ogni autovalore. Attento a $(1-i)^2=1-2i+i^2$.","sol":"<b>Autovalori di $A^2$ (compito 08/09/2023).</b> $A^2=\\sum_k\\lambda_k^2P_k$: $1^2=1$, $i^2=-1$, $(1-i)^2=1-2i-1=-2i$. Gli stessi proiettori di $A$, autovalori al quadrato. &Egrave; il passo che decide l'esercizio: l'argomento &egrave; $A^2$, quindi in $f$ entra $\\lambda_k^2$.","cont":"Ora applica l'esponenziale &rarr;"},{"t":"Segue $e^{A^2}=$","opts":[{"x":"$e^{1}P_1+e^{-1}P_2+e^{-2i}P_3$, con $e^{-2i}=\\cos2-i\\sin2$","c":true},{"x":"$e^{1}P_1+e^{i}P_2+e^{1-i}P_3$"},{"x":"$(e P_1+e^i P_2+e^{1-i}P_3)^2$"},{"x":"$e^{1}P_1+e^{i^2}P_2+e^{(1-i)}P_3$"}],"hint":"$f(A^2)=\\sum_k f(\\lambda_k^2)P_k$ con $f=\\exp$. Valuta $\\exp$ su $1,-1,-2i$.","sol":"<b>Esponenziale via spettro.</b> $e^{A^2}=\\sum_k e^{\\lambda_k^2}P_k=e^{1}P_1+e^{-1}P_2+e^{-2i}P_3$. L'ultimo termine $e^{-2i}=\\cos2-i\\sin2$ ha modulo $1$: puramente oscillante. Chi calcola $(e^{\\lambda_k})^2$ o dimentica di quadrare gli autovalori sbaglia l'intera matrice."}]},{"pool":"matrici","src":"20240115 Es.3","steps":[{"t":"Matrice $A$ $3\\times3$, autovettori ortonormali, autovalori $\\lambda_1=-1$, $\\lambda_2=1$, $\\lambda_3=2$. Allora $\\cos(A\\pi)=$","opts":[{"x":"$-P_1-P_2+P_3$ (in base spettrale $\\mathrm{diag}(-1,-1,1)$)","c":true},{"x":"$P_1+P_2+P_3=\\mathbb{1}$"},{"x":"$\\cos(\\pi)\\,\\mathbb{1}$"},{"x":"$-P_1+P_2+P_3$"}],"hint":"Valuta $\\cos(\\lambda_k\\pi)$: $\\cos(-\\pi)$, $\\cos(\\pi)$, $\\cos(2\\pi)$.","sol":"<b>Coseno di matrice (compito 15/01/2024).</b> $\\cos(A\\pi)=\\sum_k\\cos(\\lambda_k\\pi)P_k$. $\\cos(-\\pi)=-1$, $\\cos(\\pi)=-1$, $\\cos(2\\pi)=1$: quindi $-P_1-P_2+P_3$, diagonale $\\mathrm{diag}(-1,-1,1)$ nella base degli autovettori. La funzione agisce sugli autovalori (<b>teorema spettrale</b>)."}]},{"pool":"matrici","src":"20240618 turno B Es.3","steps":[{"t":"Sia $A=\\begin{pmatrix}1&i\\\\i&1\\end{pmatrix}=\\mathbb{1}+i\\sigma_x$. Autovalori e natura:","opts":[{"x":"$\\lambda_{\\pm}=1\\pm i=\\sqrt2\\,e^{\\pm i\\pi/4}$; $A$ &egrave; NORMALE ($AA^{\\dagger}=A^{\\dagger}A$), autovettori ortogonali","c":true},{"x":"$\\lambda_{\\pm}=\\pm i$; autovettori non ortogonali"},{"x":"$\\lambda=1$ doppio; non diagonalizzabile"},{"x":"$\\lambda_{\\pm}=1\\pm i$; ma la matrice non &egrave; diagonalizzabile"}],"hint":"$\\det(A-\\lambda\\mathbb{1})=(1-\\lambda)^2+1=0$. Sebbene non hermitiana, $A=\\mathbb{1}+i\\sigma_x$ commuta con $A^{\\dagger}=\\mathbb{1}-i\\sigma_x$: &egrave; normale.","sol":"<b>Matrice normale con autovalori complessi (compito 18/06/2024).</b> $(1-\\lambda)^2-i\\cdot i=(1-\\lambda)^2+1=0\\Rightarrow\\lambda_{\\pm}=1\\pm i=\\sqrt2\\,e^{\\pm i\\pi/4}$. $A$ non &egrave; hermitiana ma &egrave; NORMALE ($AA^{\\dagger}=A^{\\dagger}A=2\\mathbb{1}$): per il <b>teorema spettrale per operatori normali</b> ha autovettori ortogonali $v_{\\pm}=\\tfrac{1}{\\sqrt2}\\binom{1}{\\pm1}$, quindi proiettori semplici $P_{\\pm}=|v_{\\pm}\\rangle\\langle v_{\\pm}|$.","cont":"Calcola $\\log A$ &rarr;"},{"t":"Con determinazione principale del logaritmo, $\\log A=$","opts":[{"x":"$\\big(\\tfrac12\\log2+i\\tfrac{\\pi}{4}\\big)P_{+}+\\big(\\tfrac12\\log2-i\\tfrac{\\pi}{4}\\big)P_{-}$","c":true},{"x":"$\\log(1)P_{+}+\\log(1)P_{-}=0$"},{"x":"$\\log(\\sqrt2)\\,\\mathbb{1}$"},{"x":"$i\\tfrac{\\pi}{4}P_{+}+i\\tfrac{\\pi}{4}P_{-}$"}],"hint":"$\\log(re^{i\\theta})=\\log r+i\\theta$. Qui $r=\\sqrt2$, $\\theta=\\pm\\pi/4$ per i due autovalori.","sol":"<b>Logaritmo di matrice via spettro.</b> $\\log\\lambda_{\\pm}=\\log(\\sqrt2\\,e^{\\pm i\\pi/4})=\\tfrac12\\log2\\pm i\\tfrac{\\pi}{4}$. Quindi $\\log A=(\\tfrac12\\log2+i\\tfrac{\\pi}{4})P_{+}+(\\tfrac12\\log2-i\\tfrac{\\pi}{4})P_{-}$. La scelta della determinazione (taglio) fissa la fascia in cui cade $\\theta$; con la principale $\\theta\\in(-\\pi,\\pi]$ si prende $\\pm\\pi/4$."}]},{"pool":"matrici","src":"20241106 Es.3","steps":[{"t":"Matrice $A$ diagonalizzata da $S$ con autovettori ortonormali COMPLESSI, autovalori $\\lambda_1=\\sqrt2$, $\\lambda_2=\\sqrt3$, $\\lambda_3=\\sqrt6\\,e^{i\\pi/4}$. Gli autovalori di $A^2$ sono:","opts":[{"x":"$2$, $3$, $6e^{i\\pi/2}=6i$","c":true},{"x":"$\\sqrt2$, $\\sqrt3$, $\\sqrt6\\,e^{i\\pi/2}$"},{"x":"$4$, $9$, $36$"},{"x":"$2$, $3$, $6$"}],"hint":"$(\\sqrt6\\,e^{i\\pi/4})^2=6\\,e^{i\\pi/2}$: raddoppia il modulo al quadrato e l'argomento.","sol":"<b>Quadrato degli autovalori (compito 06/11/2024).</b> $\\lambda_1^2=2$, $\\lambda_2^2=3$, $\\lambda_3^2=6\\,e^{i\\pi/2}=6i$. Con $A^2=\\sum_k\\lambda_k^2P_k$: gli stessi proiettori, autovalori quadrati. Restano complessi: $6i$ non &egrave; reale.","cont":"Costruisci i proiettori (autovettori complessi) &rarr;"},{"t":"I proiettori corretti per autovettori complessi ortonormali hanno la forma:","opts":[{"x":"$(P_k)_{jl}=e^{(k)}_j\\,(e^{(k)}_l)^{*}$; e $A^2=2P_1+3P_2+6i\\,P_3$","c":true},{"x":"$(P_k)_{jl}=e^{(k)}_j\\,e^{(k)}_l$ (senza coniugio)"},{"x":"$P_k=S E_{kk}S^{-1}$ obliqui, perch&eacute; complessi"},{"x":"$(P_k)_{jl}=\\mathrm{Re}(e^{(k)}_j e^{(k)}_l)$"}],"hint":"Autovettori ORTONORMALI (anche se complessi) danno proiettori semplici, ma con il coniugato sul bra.","sol":"<b>Proiettori hermitiani con coniugio.</b> Poich&eacute; gli autovettori sono ortonormali, i proiettori sono $P_k=|e^{(k)}\\rangle\\langle e^{(k)}|$, cio&egrave; $(P_k)_{jl}=e^{(k)}_j(e^{(k)}_l)^{*}$. Il coniugio distingue questo caso da quello reale ed &egrave; la trappola dell'Es.3 del 06/11/2024. Risultato $A^2=2P_1+3P_2+6i\\,P_3$."}]},{"pool":"matrici","src":"20240618 turno A Es.3","steps":[{"t":"Matrice $A$ $3\\times3$ con autovalori $\\lambda_1=\\lambda_2=1$ (degenere, m.a.$=2$) e $\\lambda_3=-1$. Per $\\lambda=1$ l'autospazio &egrave; descritto da una sola equazione indipendente $v_3=v_1-v_2$: come si scelgono gli autovettori?","opts":[{"x":"due vettori $v^{(1)},v^{(2)}$ linearmente indipendenti dell'autospazio, in generale NON ortonormali fra loro","c":true},{"x":"un solo autovettore, perch&eacute; l'autovalore &egrave; degenere"},{"x":"si passa alla forma di Jordan"},{"x":"si prendono due vettori ortogonali qualsiasi di $\\mathbb{R}^3$"}],"hint":"m.a.=m.g.=2: l'autospazio ha dimensione 2, quindi due autovettori indipendenti. Ma nulla li rende automaticamente ortonormali.","sol":"<b>Autovalore degenere (compito 18/06/2024, turno A).</b> Le due equazioni per $\\lambda=1$ sono ridondanti: resta $v_3=v_1-v_2$, autospazio bidimensionale (m.g.$=2=$ m.a., quindi <b>diagonalizzabile</b> per il criterio m.a.=m.g.). Si scelgono due $v^{(1)},v^{(2)}$ indipendenti, ma tipicamente non ortonormali.","cont":"Come si costruiscono allora i proiettori? &rarr;"},{"t":"I proiettori $P_k$ si ottengono:","opts":[{"x":"come $P_k=S\\,P^{D}_k\\,S^{-1}$ (cambio di base), NON come $|v^{(k)}\\rangle\\langle v^{(k)}|$; si verifica $P_iP_j=\\delta_{ij}P_i$ e $\\sum_iP_i=\\mathbb{1}$","c":true},{"x":"come $|v^{(1)}\\rangle\\langle v^{(1)}|+|v^{(2)}\\rangle\\langle v^{(2)}|$ senza altre cautele"},{"x":"non esistono, perch&eacute; c'&egrave; degenerazione"},{"x":"come $\\tfrac12(|v^{(1)}\\rangle\\langle v^{(1)}|+|v^{(2)}\\rangle\\langle v^{(2)}|)$"}],"hint":"Con autovettori non ortonormali (anche nella degenerazione) la scorciatoia $|v\\rangle\\langle v|$ &egrave; falsa: serve il cambio di base o l'ortonormalizzazione preventiva.","sol":"<b>Proiettore su autospazio degenere non ortonormale.</b> Con $v^{(1)},v^{(2)}$ non ortonormali, $P_{\\lambda=1}\\neq|v^{(1)}\\rangle\\langle v^{(1)}|+|v^{(2)}\\rangle\\langle v^{(2)}|$: si usa $P_k=S P^{D}_k S^{-1}$ (colonne di $S$ = tutti gli autovettori). In alternativa si ortonormalizza l'autospazio con <b>Gram-Schmidt</b> e poi si usano i prodotti esterni. Verifica finale: $P_iP_j=\\delta_{ij}P_i$, $\\sum_iP_i=\\mathbb{1}$. &Egrave; l'errore frequentissimo del turno A del 18/06/2024."}]},{"pool":"matrici","src":"tipo &middot; nucleo 16","steps":[{"t":"In presenza di un autovalore DEGENERE, la diagonalizzabilit&agrave; dipende da:","opts":[{"x":"se la molteplicit&agrave; geometrica (dim dell'autospazio) raggiunge quella algebrica; se s&igrave; si diagonalizza, se no serve Jordan","c":true},{"x":"il segno dell'autovalore"},{"x":"la realt&agrave; dell'autovalore"},{"x":"il valore del determinante"}],"hint":"La degenerazione da sola non impedisce la diagonalizzazione: il problema nasce solo se l'autospazio &egrave; troppo piccolo.","sol":"<b>Degenerazione e criterio m.a.=m.g.</b> Un autovalore degenere &egrave; innocuo se genera un autospazio di dimensione pari alla sua molteplicit&agrave; algebrica (come nel 18/06/2024, dove m.g.$=2$). Diventa un problema solo quando m.g.$<$m.a.: allora $A$ NON &egrave; diagonalizzabile e si passa alla <b>forma di Jordan</b>. Per operatori autoaggiunti la degenerazione &egrave; sempre benigna (teorema spettrale)."}]},{"pool":"matrici","src":"tipo &middot; nucleo 16","steps":[{"t":"MODUS OPERANDI. Riconosci che una matrice NON &egrave; diagonalizzabile quando:","opts":[{"x":"un autovalore ha molteplicit&agrave; algebrica $>$ geometrica; allora $f(A)$ NON &egrave; $\\sum f(\\lambda_k)P_k$ ma richiede Jordan (e derivate di $f$)","c":true},{"x":"gli autovalori sono complessi"},{"x":"$\\det A=0$"},{"x":"la matrice non &egrave; simmetrica"}],"hint":"Il segnale &egrave; l'autospazio troppo piccolo: meno autovettori indipendenti della molteplicit&agrave; dell'autovalore.","sol":"<b>Riconoscere la non-diagonalizzabilit&agrave;.</b> Sintomo: per qualche $\\lambda$, $\\dim\\ker(A-\\lambda\\mathbb{1})<$ molteplicit&agrave; algebrica. Non esistono proiettori spettrali che ricostruiscano $A$; si usa la <b>forma di Jordan</b> e $f(A)$ acquista termini con le derivate $f'(\\lambda),f''(\\lambda),\\dots$ (equivalente: <b>teorema di Cayley-Hamilton</b> con resto polinomiale e condizioni sulle derivate). Non pu&ograve; capitare per matrici autoaggiunte."}]},{"pool":"matrici","src":"b03 Set 1","steps":[{"t":"$A=\\begin{pmatrix}\\alpha&1&1\\\\0&\\alpha&1\\\\0&0&\\alpha\\end{pmatrix}$ ha $\\lambda=\\alpha$ triplo con un solo autovettore: NON diagonalizzabile. Per $e^{At}$ via Cayley-Hamilton si scrive $e^{At}=R(A)$ con:","opts":[{"x":"$R(z)=a_0+a_1z+a_2z^2$ e le condizioni $f^{(k)}(\\alpha)=R^{(k)}(\\alpha)$ per $k=0,1,2$, con $f(z)=e^{zt}$","c":true},{"x":"$R(z)=e^{\\alpha t}$ costante"},{"x":"$R(z)=a_0+a_1z$ con una sola condizione"},{"x":"la serie $\\sum_n A^n t^n/n!$ non converge"}],"hint":"Il resto della divisione per il polinomio caratteristico $(z-\\alpha)^3$ ha grado $\\le2$. Le condizioni sono su $f$ e le sue derivate in $\\alpha$ (autovalore ripetuto).","sol":"<b>Cayley-Hamilton con autovalore ripetuto (b03 Set 1).</b> Il polinomio caratteristico &egrave; $(z-\\alpha)^3$; il <b>teorema di Cayley-Hamilton</b> dice $p(A)=0$, quindi $e^{At}=R(A)$ con $\\deg R\\le2$: $R(z)=a_0+a_1z+a_2z^2$. Poich&eacute; $\\alpha$ &egrave; radice tripla, le condizioni sono $f(\\alpha)=R(\\alpha)$, $f'(\\alpha)=R'(\\alpha)$, $f''(\\alpha)=R''(\\alpha)$ con $f(z)=e^{zt}$: tre equazioni per $a_0,a_1,a_2$. La comparsa delle DERIVATE di $f$ &egrave; la firma della non-diagonalizzabilit&agrave;.","cont":"Qual &egrave; il risultato finale? &rarr;"},{"t":"Il risultato &egrave;:","opts":[{"x":"$e^{At}=e^{\\alpha t}\\begin{pmatrix}1&t&t(2+t)/2\\\\0&1&t\\\\0&0&1\\end{pmatrix}$","c":true},{"x":"$e^{At}=e^{\\alpha t}\\,\\mathbb{1}$"},{"x":"$e^{At}=e^{\\alpha t}\\begin{pmatrix}1&t&t^2/2\\\\0&1&t\\\\0&0&1\\end{pmatrix}$"},{"x":"$e^{At}=\\begin{pmatrix}e^{\\alpha t}&t&t^2\\\\0&e^{\\alpha t}&t\\\\0&0&e^{\\alpha t}\\end{pmatrix}$"}],"hint":"La parte nilpotente $N=A-\\alpha\\mathbb{1}$ ha $N^3=0$: $e^{At}=e^{\\alpha t}(\\mathbb{1}+Nt+N^2t^2/2)$. Calcola $N^2$ (il termine $(1,3)$ non &egrave; solo $t^2/2$).","sol":"<b>Esponenziale di un blocco di Jordan.</b> $N=A-\\alpha\\mathbb{1}$ &egrave; nilpotente ($N^3=0$), quindi $e^{At}=e^{\\alpha t}\\big(\\mathbb{1}+Nt+\\tfrac12N^2t^2\\big)$. Con questo $N$ specifico l'elemento $(1,3)$ risulta $t+t^2/2=t(2+t)/2$ (contributo di $N$ e di $N^2$). Coincide col metodo di Cayley-Hamilton. Il termine $(1,3)$ NON &egrave; $t^2/2$ perch&eacute; anche $N$ contribuisce in quella posizione."}]},{"pool":"matrici","src":"More problems Ex 13","steps":[{"t":"$A=\\begin{pmatrix}1&2\\\\0&1\\end{pmatrix}$ (non diagonalizzabile, $\\lambda=1$ doppio). Le potenze $A^n$ valgono:","opts":[{"x":"$A^n=\\begin{pmatrix}1&2n\\\\0&1\\end{pmatrix}$","c":true},{"x":"$A^n=\\begin{pmatrix}1&2^n\\\\0&1\\end{pmatrix}$"},{"x":"$A^n=\\begin{pmatrix}1&2n\\\\0&2^n\\end{pmatrix}$"},{"x":"$A^n=\\begin{pmatrix}n&2n\\\\0&n\\end{pmatrix}$"}],"hint":"Scrivi $A=\\mathbb{1}+N$ con $N=\\begin{pmatrix}0&2\\\\0&0\\end{pmatrix}$, $N^2=0$: binomio con solo due termini.","sol":"<b>Potenze di $\\mathbb{1}+N$ nilpotente (More problems Ex 13).</b> $A=\\mathbb{1}+N$, $N^2=0$, e $\\mathbb{1}$ commuta con $N$: per il <b>binomio di Newton</b> $A^n=(\\mathbb{1}+N)^n=\\mathbb{1}+nN$ (tutti i termini con $N^2$ si annullano). Quindi $A^n=\\begin{pmatrix}1&2n\\\\0&1\\end{pmatrix}$.","cont":"Somma la serie per $e^{tA}$ &rarr;"},{"t":"Segue $e^{tA}=$","opts":[{"x":"$e^{t}\\begin{pmatrix}1&2t\\\\0&1\\end{pmatrix}$","c":true},{"x":"$\\begin{pmatrix}e^t&2t\\\\0&e^t\\end{pmatrix}$"},{"x":"$e^{t}\\begin{pmatrix}1&t^2\\\\0&1\\end{pmatrix}$"},{"x":"$e^{2t}\\begin{pmatrix}1&2t\\\\0&1\\end{pmatrix}$"}],"hint":"$e^{tA}=e^{t\\mathbb{1}}e^{tN}=e^t(\\mathbb{1}+tN)$ (lecito perch&eacute; $\\mathbb{1}$ e $N$ commutano).","sol":"<b>Esponenziale (parte scalare + nilpotente).</b> $A=\\mathbb{1}+N$ con $[\\mathbb{1},N]=0$, quindi $e^{tA}=e^{t}e^{tN}=e^{t}(\\mathbb{1}+tN)=e^{t}\\begin{pmatrix}1&2t\\\\0&1\\end{pmatrix}$. La fattorizzazione $e^{X+Y}=e^Xe^Y$ vale QUI solo perch&eacute; $[\\mathbb{1},N]=0$: in generale (matrici che non commutano) &egrave; falsa."}]},{"pool":"matrici","src":"More problems Ex 14","steps":[{"t":"$A=\\begin{pmatrix}3&5\\\\1&-1\\end{pmatrix}$: autovalori (diagonalizzabile) e primo passo per $e^{tA}$:","opts":[{"x":"$\\lambda_1=-2$, $\\lambda_2=4$ (distinti $\\Rightarrow$ diagonalizzabile); $e^{tA}=e^{-2t}P_1+e^{4t}P_2$","c":true},{"x":"$\\lambda=\\pm\\sqrt{15}$"},{"x":"$\\lambda=1$ doppio, serve Jordan"},{"x":"$\\lambda_1=3,\\lambda_2=-1$ (dalla diagonale)"}],"hint":"$\\det(A-\\lambda\\mathbb{1})=(3-\\lambda)(-1-\\lambda)-5=\\lambda^2-2\\lambda-8$. Non &egrave; triangolare: gli autovalori NON sono sulla diagonale.","sol":"<b>Autovalori e diagonalizzabilit&agrave; (More problems Ex 14).</b> $\\lambda^2-2\\lambda-8=(\\lambda+2)(\\lambda-4)=0\\Rightarrow\\lambda_1=-2,\\lambda_2=4$. Autovalori distinti $\\Rightarrow$ diagonalizzabile (criterio: autovalori distinti sono sufficienti). $e^{tA}=\\sum_k e^{\\lambda_k t}P_k$. Attenzione: $A$ non &egrave; triangolare, gli autovalori non si leggono dalla diagonale.","cont":"Risultato in forma matriciale &rarr;"},{"t":"Con i proiettori spettrali, $e^{tA}=$","opts":[{"x":"$\\tfrac16\\begin{pmatrix}e^{-2t}+5e^{4t}&-5e^{-2t}+5e^{4t}\\\\-e^{-2t}+e^{4t}&5e^{-2t}+e^{4t}\\end{pmatrix}$","c":true},{"x":"$\\begin{pmatrix}e^{-2t}&0\\\\0&e^{4t}\\end{pmatrix}$"},{"x":"$e^{-2t}\\mathbb{1}+e^{4t}\\mathbb{1}$"},{"x":"$\\tfrac16\\begin{pmatrix}e^{4t}+5e^{-2t}&\\dots\\\\\\dots&\\dots\\end{pmatrix}$"}],"hint":"$P_1=\\dfrac{A-\\lambda_2\\mathbb{1}}{\\lambda_1-\\lambda_2}$, $P_2=\\dfrac{A-\\lambda_1\\mathbb{1}}{\\lambda_2-\\lambda_1}$ (formula di interpolazione di Lagrange sui proiettori), poi $e^{-2t}P_1+e^{4t}P_2$.","sol":"<b>Proiettori via interpolazione + esponenziale.</b> Per due autovalori distinti i proiettori sono $P_1=(A-4\\mathbb{1})/(-6)$, $P_2=(A+2\\mathbb{1})/6$ (<b>formula di Lagrange/Sylvester</b> per le funzioni di matrice). Sostituendo in $e^{-2t}P_1+e^{4t}P_2$ si ottiene $\\tfrac16\\begin{pmatrix}e^{-2t}+5e^{4t}&-5e^{-2t}+5e^{4t}\\\\-e^{-2t}+e^{4t}&5e^{-2t}+e^{4t}\\end{pmatrix}$ (compito More problems Ex 14)."}]},{"pool":"matrici","src":"More problems Ex 17","steps":[{"t":"Sia $A=\\begin{pmatrix}0&1\\\\\\alpha^2&0\\end{pmatrix}$, che soddisfa $A^2=\\alpha^2\\mathbb{1}$. Allora $A\\sinh(A)=$","opts":[{"x":"$\\alpha\\sinh(\\alpha)\\,\\mathbb{1}$","c":true},{"x":"$\\sinh(\\alpha^2)\\,\\mathbb{1}$"},{"x":"$\\alpha^2\\sinh(\\alpha)\\,A$"},{"x":"$\\sinh(\\alpha)\\,A$"}],"hint":"Usa la serie $\\sinh A=\\sum_k A^{2k+1}/(2k+1)!$ e $A^{2k}=\\alpha^{2k}\\mathbb{1}$: raccogli.","sol":"<b>Funzione di matrice con $A^2=\\alpha^2\\mathbb{1}$ (More problems Ex 17).</b> $\\sinh A=\\sum_k\\dfrac{A^{2k+1}}{(2k+1)!}=A\\sum_k\\dfrac{(A^2)^k}{(2k+1)!}=A\\sum_k\\dfrac{\\alpha^{2k}}{(2k+1)!}=A\\,\\dfrac{\\sinh\\alpha}{\\alpha}$. Quindi $A\\sinh A=A^2\\dfrac{\\sinh\\alpha}{\\alpha}=\\alpha^2\\mathbb{1}\\cdot\\dfrac{\\sinh\\alpha}{\\alpha}=\\alpha\\sinh(\\alpha)\\,\\mathbb{1}$. La relazione $A^2\\propto\\mathbb{1}$ (tipica di $\\hat n\\cdot\\vec\\sigma$) chiude le serie senza diagonalizzare."}]},{"pool":"matrici","src":"b03 Set 1","steps":[{"t":"Per $\\hat n\\cdot\\vec\\sigma$ (versore reale) vale $(\\hat n\\cdot\\vec\\sigma)^2=\\mathbb{1}$, autovalori $\\pm1$. Allora $e^{i\\theta\\,\\hat n\\cdot\\vec\\sigma}=$","opts":[{"x":"$\\cos\\theta\\,\\mathbb{1}+i\\sin\\theta\\,(\\hat n\\cdot\\vec\\sigma)$","c":true},{"x":"$e^{i\\theta}\\,\\mathbb{1}$"},{"x":"$\\cos\\theta\\,\\mathbb{1}+\\sin\\theta\\,(\\hat n\\cdot\\vec\\sigma)$"},{"x":"$\\cosh\\theta\\,\\mathbb{1}+i\\sinh\\theta\\,(\\hat n\\cdot\\vec\\sigma)$"}],"hint":"Autovalori $\\pm1$: il resto di Cayley-Hamilton &egrave; lineare $R(z)=a_0+a_1z$, con $e^{\\pm i\\theta}=a_0\\pm a_1$.","sol":"<b>Formula di Eulero per matrici (b03 Set 1).</b> Per il <b>teorema di Cayley-Hamilton</b> (grado 2, resto lineare) $e^{i\\theta M}=a_0\\mathbb{1}+a_1M$ con $M=\\hat n\\cdot\\vec\\sigma$; le condizioni sugli autovalori $\\pm1$ danno $e^{i\\theta}=a_0+a_1$, $e^{-i\\theta}=a_0-a_1$, quindi $a_0=\\cos\\theta$, $a_1=i\\sin\\theta$. Risultato $\\cos\\theta\\,\\mathbb{1}+i\\sin\\theta\\,(\\hat n\\cdot\\vec\\sigma)$. &Egrave; la rotazione di spin: l'analogo matriciale di $e^{i\\theta}=\\cos\\theta+i\\sin\\theta$.","cont":"Perch&eacute; il resto &egrave; lineare e non quadratico? &rarr;"},{"t":"Il resto $R(z)$ ha grado $\\le1$ perch&eacute;:","opts":[{"x":"il polinomio minimo di $\\hat n\\cdot\\vec\\sigma$ &egrave; $(z^2-1)$ di grado 2: il resto della divisione ha grado $\\le1$","c":true},{"x":"la matrice &egrave; $2\\times2$, sempre resto lineare"},{"x":"$\\theta$ &egrave; piccolo"},{"x":"gli autovalori sono reali"}],"hint":"Il grado del resto &egrave; strettamente minore del grado del polinomio minimo, non della dimensione.","sol":"<b>Grado del resto = grado del polinomio minimo meno uno.</b> Poich&eacute; $(\\hat n\\cdot\\vec\\sigma)^2=\\mathbb{1}$, il <b>polinomio minimo</b> &egrave; $z^2-1$ (grado 2); dividendo $e^{i\\theta z}$ per esso il resto ha grado $\\le1$. Se il polinomio minimo fosse di grado 3 (es. blocco di Jordan $3\\times3$) il resto sarebbe quadratico. &Egrave; il polinomio MINIMO, non il caratteristico, a fissare il grado quando ci sono ripetizioni/relazioni."}]},{"pool":"matrici","src":"More problems","steps":[{"t":"Matrice $A$ $3\\times3$ hermitiana con $\\lambda_1=1$ e $\\lambda_2=\\lambda_3=3$ (degenere), proiettori ortogonali. Se $P_{(3)}=\\begin{pmatrix}1/2&0&1/2\\\\0&1&0\\\\1/2&0&1/2\\end{pmatrix}$ &egrave; il proiettore sull'autospazio di $\\lambda=3$, allora $\\log A=$","opts":[{"x":"$\\log3\\begin{pmatrix}1/2&0&1/2\\\\0&1&0\\\\1/2&0&1/2\\end{pmatrix}$ (perch&eacute; $\\log1=0$ elimina il contributo di $\\lambda_1$)","c":true},{"x":"$\\log3\\,\\mathbb{1}$"},{"x":"$\\log1\\cdot P_1+\\log3\\cdot P_{(3)}=\\mathbb{1}+\\log3\\,P_{(3)}$"},{"x":"$\\log3\\begin{pmatrix}1&0&1\\\\0&1&0\\\\1&0&1\\end{pmatrix}$"}],"hint":"$\\log A=\\log(1)P_1+\\log(3)P_{(3)}$: il primo termine si annulla perch&eacute; $\\log1=0$.","sol":"<b>Logaritmo con autovalore degenere (More problems).</b> $\\log A=\\sum_k\\log(\\lambda_k)P_k=\\log(1)P_1+\\log(3)P_{(3)}=\\log3\\cdot P_{(3)}$, poich&eacute; $\\log1=0$ cancella il proiettore su $\\lambda_1$. La degenerazione $\\lambda_2=\\lambda_3$ &egrave; benigna (matrice hermitiana): il proiettore $P_{(3)}$ &egrave; l'unico oggetto che serve, gi&agrave; ortogonale per il <b>teorema spettrale</b>."}]},{"pool":"matrici","src":"b03 Set 1 Ex 12","steps":[{"t":"Per calcolare $\\log A$ o $A^{3/2}$ quando $A$ ha autovalori COMPLESSI, la scelta del taglio (branch cut) serve a:","opts":[{"x":"fissare in quale fascia cade l'argomento $\\theta$ di ogni $\\lambda_k=r e^{i\\theta}$, rendendo $\\log$ (e le potenze non intere) una funzione a valore singolo","c":true},{"x":"decidere se la matrice &egrave; diagonalizzabile"},{"x":"garantire che gli autovalori siano reali"},{"x":"normalizzare gli autovettori"}],"hint":"$\\log$ e $z^{3/2}$ sono polidrome: senza fissare il foglio, $\\theta$ &egrave; definito a meno di $2\\pi$ e la funzione &egrave; ambigua.","sol":"<b>Branch cut nelle funzioni di matrice (b03 Set 1 Ex 12).</b> $\\log\\lambda=\\log r+i\\theta$ e $\\lambda^{3/2}=r^{3/2}e^{i\\tfrac32\\theta}$ dipendono dalla determinazione di $\\theta$. Il taglio fissa la fascia (es. $\\theta\\in[0,2\\pi)$ per taglio sul semiasse reale positivo, oppure $\\theta\\in(-\\pi,\\pi]$ per la principale). Ogni autovalore va scritto in forma polare CON la determinazione data prima di applicare la funzione."}]},{"pool":"matrici","src":"b03 Set 1 Ex 12","steps":[{"t":"Matrice $3\\times3$ con autovalori $\\lambda_1=2$, $\\lambda_2=1+i$, $\\lambda_3=1-i$ e autovettori NON ortogonali; taglio sul semiasse reale positivo, $\\theta\\in[0,2\\pi)$, log reale su $\\mathbb{R}^{+}$. I logaritmi degli autovalori sono:","opts":[{"x":"$\\log2$; $\\tfrac12\\log2+i\\tfrac{\\pi}{4}$; $\\tfrac12\\log2+i\\tfrac{7\\pi}{4}$","c":true},{"x":"$\\log2$; $\\tfrac12\\log2+i\\tfrac{\\pi}{4}$; $\\tfrac12\\log2-i\\tfrac{\\pi}{4}$"},{"x":"$\\log2$; $\\log2+i\\pi/4$; $\\log2-i\\pi/4$"},{"x":"$2$; $1+i$; $1-i$"}],"hint":"$1+i=\\sqrt2 e^{i\\pi/4}$; $1-i=\\sqrt2 e^{i7\\pi/4}$ CON la determinazione $\\theta\\in[0,2\\pi)$ (non $-\\pi/4$). Il modulo &egrave; $\\sqrt2$, quindi $\\log\\sqrt2=\\tfrac12\\log2$.","sol":"<b>Logaritmo con taglio su $\\mathbb{R}^{+}$ (b03 Set 1 Ex 12).</b> $|1\\pm i|=\\sqrt2\\Rightarrow\\log\\sqrt2=\\tfrac12\\log2$. Argomenti nella fascia $[0,2\\pi)$: $\\arg(1+i)=\\pi/4$, $\\arg(1-i)=7\\pi/4$ (NON $-\\pi/4$: il taglio su $\\mathbb{R}^{+}$ impone $\\theta\\ge0$). Quindi $\\log\\lambda_2=\\tfrac12\\log2+i\\tfrac{\\pi}{4}$, $\\log\\lambda_3=\\tfrac12\\log2+i\\tfrac{7\\pi}{4}$. La scelta del foglio &egrave; ci&ograve; che rende $\\log\\lambda_3$ diverso dal complesso coniugato di $\\log\\lambda_2$.","cont":"Come si assemblano i proiettori? &rarr;"},{"t":"Poich&eacute; gli autovettori NON sono ortogonali, $\\log A=\\sum_k(\\log\\lambda_k)P_k$ con:","opts":[{"x":"$P_k=S\\,E_{kk}\\,S^{-1}$ (proiettori obliqui dal cambio di base), NON $|v_k\\rangle\\langle v_k|$","c":true},{"x":"$P_k=|v_k\\rangle\\langle v_k|$ normalizzando"},{"x":"$P_k=|v_k\\rangle\\langle v_k|^{*}$"},{"x":"nessun proiettore: $A$ non &egrave; diagonalizzabile"}],"hint":"Autovalori distinti $\\Rightarrow$ diagonalizzabile, ma autovettori obliqui $\\Rightarrow$ serve $S E_{kk}S^{-1}$.","sol":"<b>Funzione di matrice con autovettori obliqui.</b> $A$ &egrave; diagonalizzabile (tre autovalori distinti), ma gli autovettori non sono ortonormali: i proiettori sono $P_k=S E_{kk}S^{-1}$ (colonne di $S$ = autovettori). Poi $\\log A=\\log2\\,P_1+(\\tfrac12\\log2+i\\tfrac{\\pi}{4})P_2+(\\tfrac12\\log2+i\\tfrac{7\\pi}{4})P_3$. Doppia cautela dell'Ex 12: taglio per il logaritmo E cambio di base per i proiettori."}]},{"pool":"matrici","src":"b03 Set 1","steps":[{"t":"Due matrici $A,B$ COMMUTANO ($[A,B]=0$). Cosa garantisce ci&ograve; sulla diagonalizzazione?","opts":[{"x":"se entrambe sono diagonalizzabili, esiste una base COMUNE di autovettori che le diagonalizza simultaneamente","c":true},{"x":"$A$ e $B$ hanno gli stessi autovalori"},{"x":"$A+B$ non &egrave; diagonalizzabile"},{"x":"$A$ e $B$ sono entrambe hermitiane"}],"hint":"Commutare non significa avere gli stessi autovalori, ma poter condividere gli autovettori.","sol":"<b>Diagonalizzazione simultanea (b03 Set 1).</b> Due operatori diagonalizzabili che commutano ammettono una base comune di autovettori. In un autospazio degenere di $A$, $B$ agisce internamente e vi si diagonalizza: la degenerazione di uno &egrave; risolta dall'altro. In meccanica quantistica &egrave; il motivo per cui osservabili compatibili ($[A,B]=0$) hanno autostati comuni e numeri quantici simultanei."}]},{"pool":"matrici","src":"tipo &middot; nucleo 16","steps":[{"t":"Le potenze $A^n$ di una matrice diagonalizzabile si calcolano via spettro come:","opts":[{"x":"$A^n=\\sum_k\\lambda_k^n P_k$: si elevano solo gli autovalori, i proiettori restano invariati","c":true},{"x":"$A^n=n\\sum_k\\lambda_k P_k$"},{"x":"$A^n=\\big(\\sum_k\\lambda_k P_k\\big)$ per ogni $n$"},{"x":"si moltiplica $A$ per s&eacute; stessa $n$ volte, senza scorciatoie"}],"hint":"$A^n$ &egrave; $f(A)$ con $f(z)=z^n$: applica la regola generale sugli autovalori.","sol":"<b>Potenze via spettro.</b> $A^n=f(A)$ con $f(z)=z^n$, quindi $A^n=\\sum_k\\lambda_k^nP_k$ (usando $P_kP_j=\\delta_{kj}P_k$). &Egrave; il caso polinomiale del <b>teorema spettrale</b>: se $\\lambda_k$ complessi, $\\lambda_k^n$ ruota di $n$ volte l'argomento. Per matrici non diagonalizzabili si passa a Jordan (compaiono coefficienti binomiali con le potenze del blocco nilpotente)."}]},{"pool":"matrici","src":"b03 Set 1","steps":[{"t":"Sia $A=\\begin{pmatrix}1&0&i\\\\0&1&0\\\\-i&0&1\\end{pmatrix}$ (hermitiana). Autovalori e loro natura:","opts":[{"x":"$\\lambda=0,1,2$, tutti REALI (matrice hermitiana), con base ortonormale di autovettori garantita","c":true},{"x":"$\\lambda=1,1,1$ triplo"},{"x":"$\\lambda=\\pm i,1$"},{"x":"$\\lambda=1\\pm i,\\,1$"}],"hint":"$A=A^{\\dagger}$ (la trasposta coniugata ricopia $A$): autovalori reali per il teorema spettrale. Il blocco centrale disaccoppia $\\lambda=1$; il blocco $2\\times2$ su $(1,3)$ d&agrave; $1\\pm1$.","sol":"<b>Diagonalizzazione hermitiana $3\\times3$ (b03 Set 1).</b> $A^{\\dagger}=A$ (il coniugato di $i$ nell'angolo &egrave; $-i$, gi&agrave; presente): per il <b>teorema spettrale</b> gli autovalori sono reali. La riga/colonna centrale isola $\\lambda=1$; il sotto-blocco $\\begin{pmatrix}1&i\\\\-i&1\\end{pmatrix}$ ha autovalori $1\\pm1=0,2$. Spettro $\\{0,1,2\\}$, base ortonormale (anche se gli autovettori sono complessi).","cont":"Costruisci il proiettore su $\\lambda=2$ &rarr;"},{"t":"L'autovettore di $\\lambda=2$ &egrave; $e_3=\\tfrac{1}{\\sqrt2}(i,0,1)$. Il proiettore $P_3=|e_3\\rangle\\langle e_3|$ vale:","opts":[{"x":"$\\tfrac12\\begin{pmatrix}1&0&i\\\\0&0&0\\\\-i&0&1\\end{pmatrix}$ (con il coniugato sul bra: $(P_3)_{jl}=e_{3,j}\\,e_{3,l}^{*}$)","c":true},{"x":"$\\tfrac12\\begin{pmatrix}1&0&i\\\\0&0&0\\\\i&0&1\\end{pmatrix}$ (senza coniugio)"},{"x":"$\\tfrac12\\begin{pmatrix}-1&0&i\\\\0&0&0\\\\-i&0&-1\\end{pmatrix}$"},{"x":"$\\begin{pmatrix}i&0&0\\\\0&0&0\\\\0&0&1\\end{pmatrix}$"}],"hint":"$(P_3)_{jl}=e_{3,j}(e_{3,l})^{*}$ con $e_3=(i,0,1)/\\sqrt2$: l'elemento $(3,1)$ &egrave; $1\\cdot(i)^{*}=-i$, non $+i$.","sol":"<b>Proiettore hermitiano con autovettore complesso.</b> $(P_3)_{jl}=e_{3,j}(e_{3,l})^{*}$; con $e_3=(i,0,1)/\\sqrt2$: $(P_3)_{11}=i\\cdot(-i)/2=1/2$, $(P_3)_{13}=i\\cdot1/2=i/2$, $(P_3)_{31}=1\\cdot(-i)/2=-i/2$, $(P_3)_{33}=1/2$. Quindi $P_3=\\tfrac12\\begin{pmatrix}1&0&i\\\\0&0&0\\\\-i&0&1\\end{pmatrix}$, hermitiano ($P_3=P_3^{\\dagger}$) e idempotente. Il coniugio sul bra (<b>definizione di prodotto scalare hermitiano</b>) rende $(3,1)=-i$: dimenticarlo produce una matrice non hermitiana."}]},{"pool":"matrici","src":"tipo &middot; nucleo 16","steps":[{"t":"MODUS OPERANDI. Controllo rapido degli autovalori PRIMA di proseguire: traccia e determinante devono soddisfare:","opts":[{"x":"$\\mathrm{tr}\\,A=\\sum_k\\lambda_k$ e $\\det A=\\prod_k\\lambda_k$ (contando le molteplicit&agrave;)","c":true},{"x":"$\\mathrm{tr}\\,A=\\prod_k\\lambda_k$ e $\\det A=\\sum_k\\lambda_k$"},{"x":"$\\mathrm{tr}\\,A=\\det A$ sempre"},{"x":"$\\mathrm{tr}\\,A=0$ per ogni matrice diagonalizzabile"}],"hint":"La traccia &egrave; invariante per similitudine e uguaglia la somma della diagonale della forma diagonalizzata; il determinante ne &egrave; il prodotto.","sol":"<b>Relazioni di Vieta / invarianti spettrali.</b> Dal polinomio caratteristico $\\det(A-\\lambda\\mathbb{1})=\\prod_k(\\lambda_k-\\lambda)$ seguono $\\mathrm{tr}\\,A=\\sum_k\\lambda_k$ (coefficiente sub-principale) e $\\det A=\\prod_k\\lambda_k$ (termine noto). Sono invarianti per similitudine: si calcolano dalla matrice originale e devono coincidere con gli autovalori trovati. &Egrave; il controllo di dieci secondi che intercetta un autovalore sbagliato prima di costruire $f(A)$."}]},{"pool":"matrici","src":"tipo &middot; b01 &middot; nucleo 16","steps":[{"t":"MODUS OPERANDI (riepilogo-strategia). La sequenza completa per calcolare $f(A)$ allo scritto &egrave;:","opts":[{"x":"autovalori $\\to$ verifica diagonalizzabilit&agrave; (m.a.=m.g.) $\\to$ autovettori e loro ortonormalit&agrave; $\\to$ proiettori (esterni o $SE_{kk}S^{-1}$) $\\to$ $f(A)=\\sum f(\\lambda_k)P_k$ $\\to$ controllo $\\sum P_k=\\mathbb{1}$","c":true},{"x":"serie di Taylor di $f(A)$ e somma diretta"},{"x":"$f$ della traccia, poi $\\times\\mathbb{1}$"},{"x":"proiettori $|v\\rangle\\langle v|$ sempre, poi $f$ sugli autovalori"}],"hint":"Tre bivi in ordine: diagonalizzabile o no; autovettori ortonormali o no; argomento $A$ o $A^2$/branch cut. Ogni bivio cambia la formula.","sol":"<b>Sequenza operativa completa (funzioni di matrice via teorema spettrale).</b> (1) autovalori dal polinomio caratteristico; (2) verifica m.a.=m.g. &mdash; se fallisce, forma di Jordan / Cayley-Hamilton con derivate di $f$; (3) autovettori e controllo di ortonormalit&agrave; &mdash; automatica se $A$ normale/autoaggiunta, altrimenti da verificare; (4) proiettori: $|v_k\\rangle\\langle v_k|$ se ortonormali (con coniugio se complessi), $SE_{kk}S^{-1}$ se obliqui; (5) $f(A)=\\sum_k f(\\lambda_k)P_k$, con $\\lambda_k^2$ se l'argomento &egrave; $A^2$ e con la determinazione giusta se $f$ &egrave; polidroma; (6) verifica finale $\\sum_kP_k=\\mathbb{1}$, $P_k^2=P_k$. I passi (2) e (3) sono i due bivi dove cadono gli scritti."}]}]};

/* ===== ENGINE ===== */
var S = { units:[], ui:0, si:0, correct:0, total:0, answered:false };

/* =====================================================================
   TRACCIA — il quiz ricorda le risposte.  (Accensione, 2026-07-31)
   Prima di questo blocco il motore non salvava una singola risposta da
   nessuna parte: chiuso il tab, il tentativo spariva. Senza questo dato
   la navicella non ha nessun segnale esterno su cui correggersi.
