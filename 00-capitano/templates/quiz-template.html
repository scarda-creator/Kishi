<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITOLO}}</title>

<!-- ===== KaTeX (CDN jsDelivr) — NON toccare ===== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --border:#2b333d;
    --txt:#eef3f8; --muted:#b9c4d1; --accent:#4c8dff; --accent2:#8fb0ff;
    --ok:#2ea043; --okbg:#10331b; --bad:#d83a3a; --badbg:#3a1414;
    --warn:#d8a13a; --warnbg:#332a10;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.5;}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 22px;}
  .hidden{display:none!important;}

  /* ---- MENU ---- */
  .mode-row{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .mode-btn{flex:1;min-width:220px;border:1px solid var(--border);background:var(--panel);
    color:var(--txt);padding:16px;border-radius:12px;cursor:pointer;text-align:left;
    transition:.15s;}
  .mode-btn:hover{border-color:var(--accent);background:var(--panel2);}
  .mode-btn b{font-size:1.05rem;}
  .mode-btn span{display:block;color:var(--muted);font-size:.85rem;margin-top:4px;}
  .mode-btn.primary{border-color:var(--accent);background:#13233f;}

  .pool-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.pool-grid{grid-template-columns:1fr;}}
  .pool-card{border:1px solid var(--border);background:var(--panel);border-radius:12px;
    padding:14px;cursor:pointer;transition:.15s;position:relative;}
  .pool-card:hover{border-color:var(--accent);background:var(--panel2);}
  .pool-card.empty{opacity:.55;cursor:not-allowed;}
  .pool-card.empty:hover{border-color:var(--border);background:var(--panel);}
  .pool-card .n{font-weight:600;font-size:.98rem;}
  .pool-card .meta{color:var(--muted);font-size:.8rem;margin-top:6px;}
  .badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;
    border-radius:20px;margin-top:8px;letter-spacing:.3px;}
  .badge.full{background:var(--okbg);color:#5fd980;border:1px solid #235c33;}
  .badge.todo{background:var(--warnbg);color:#e0b85a;border:1px solid #5c4a23;}

  /* ---- QUIZ ---- */
  .qhead{display:flex;justify-content:space-between;align-items:center;
    color:var(--muted);font-size:.82rem;margin-bottom:14px;gap:12px;}
  .qhead .src{font-style:italic;}
  .progress{height:5px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:18px;}
  .progress > i{display:block;height:100%;background:var(--accent);width:0;transition:.3s;}

  .fig{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:12px;margin:0 0 16px;text-align:center;overflow-x:auto;}
  .qtext{font-size:1.08rem;margin:0 0 18px;}
  .qtext .lbl{display:inline-block;background:var(--panel2);border:1px solid var(--border);
    color:var(--accent2);font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:6px;
    margin-right:8px;vertical-align:middle;}

  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{border:1px solid var(--border);background:var(--panel);color:var(--txt);
    padding:13px 15px;border-radius:10px;cursor:pointer;text-align:left;
    font-size:1rem;transition:.12s;}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--panel2);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--ok);background:var(--okbg);}
  .opt.wrong{border-color:var(--bad);background:var(--badbg);}

  .fb{margin-top:16px;border-radius:10px;padding:14px;font-size:.95rem;display:none;}
  .fb.show{display:block;}
  .fb.hint{background:var(--badbg);border:1px solid #6b2222;}
  .fb.hint b{color:#ff8585;}
  .fb.sol{background:var(--okbg);border:1px solid #235c33;}
  .fb.sol b{color:#5fd980;}

  .navrow{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .cont{background:var(--accent);color:#fff;border:none;padding:12px 20px;border-radius:10px;
    font-size:1rem;font-weight:600;cursor:pointer;transition:.12s;}
  .cont:hover{background:var(--accent2);}
  .menu-btn{background:transparent;color:var(--muted);border:1px solid var(--border);
    padding:10px 16px;border-radius:10px;cursor:pointer;font-size:.9rem;}
  .menu-btn:hover{color:var(--txt);border-color:var(--accent);}

  .end{text-align:center;padding:40px 10px;}
  .end h2{font-size:1.4rem;}
  .end .score{font-size:2.2rem;font-weight:700;color:var(--accent2);margin:10px 0;}

  .katex{font-size:1.02em;color:var(--txt);}
  .mode-btn.primary span{color:#cdd8e6;}
  .katex-display{margin:.4em 0;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===================== MENU ===================== -->
  <section id="menu">
    <h1>{{TITOLO}}</h1>
    <p class="sub">{{SOTTOTITOLO}}</p>

    <div class="mode-row">
      <button class="mode-btn primary" onclick="start('ALL')">
        <b>&#127922; Mischia tutto</b>
        <span>Tutte le domande dei pool disponibili, in ordine casuale.</span>
      </button>
    </div>

    <div class="pool-grid" id="poolGrid"></div>
  </section>

  <!-- ===================== QUIZ ===================== -->
  <section id="quiz" class="hidden">
    <div class="qhead">
      <span id="qpool"></span>
      <span id="qpos"></span>
    </div>
    <div class="progress"><i id="qbar"></i></div>

    <div class="fig hidden" id="qfig"></div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="qopts"></div>

    <div class="fb hint" id="qhint"></div>
    <div class="fb sol" id="qsol"></div>

    <div class="navrow">
      <button class="menu-btn" onclick="toMenu()">&#8592; Menu</button>
      <button class="cont hidden" id="qcont"></button>
    </div>
  </section>

  <!-- ===================== END ===================== -->
  <section id="end" class="hidden">
    <div class="end">
      <h2>Pool completato</h2>
      <div class="score" id="endScore"></div>
      <p class="sub" id="endMsg"></p>
      <button class="cont" onclick="toMenu()">Torna al menu</button>
    </div>
  </section>

</div>

<script>
"use strict";

/* =====================================================================
   RENDERING MATEMATICO — KaTeX su contenuto iniettato dinamicamente.
   NON toccare: ogni innerHTML con LaTeX e' seguito da typeset(node).
   ===================================================================== */
function typeset(el){
  if(el && window.renderMathInElement){
    try{
      renderMathInElement(el,{
        delimiters:[
          {left:'$$',right:'$$',display:true},
          {left:'$',right:'$',display:false}
        ],
        throwOnError:false
      });
    }catch(e){/* no-op */}
  }
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

/* =====================================================================
   >>> ZONA DATI — QUI SCRIVE IL DEMIURGO <<<
   Sono gli UNICI due blocchi da riempire. Il resto del file NON si tocca.

   --- POOLS: un elemento per pool, nell'ordine del menu (priorita' decr.) ---
   { id:'slug', name:'N &middot; Nome leggibile', diff:'3&ndash;4', status:'full'|'todo' }
     id     : slug ascii senza spazi, coincide con la chiave di Q (Q.slug)
     name   : usa entita' HTML per accenti/simboli (&agrave; &middot; &mdash;)
     status : 'full' = popolato | 'todo' = card non cliccabile "DA ESTENDERE"

   --- Q: banca domande. Una chiave per pool. ---
   Q.slug = [ unit, unit, ... ]
   unit = { pool:'slug', src:'origine (es. 20240704 Es.3  oppure  tipo F · manuale)',
            steps:[ step, ... ] }              // 1 step = domanda secca; >1 = graduata
   step = { t:'testo domanda', opts:[{x:'testo',c:true}, {x:'...'}, ...],
            hint:'suggerimento sul trabocchetto', sol:'soluzione che cita il teorema',
            cont:'(opz.) etichetta bottone di avanzamento' }

   REGOLE DATI (le verifica quiz_verifica.js):
   - opts: >=2 opzioni, ESATTAMENTE una con c:true. Distrattori = trabocchetti reali.
   - hint: NON ripete la domanda, punta all'errore. sol: cita il teorema/criterio.
   - Matematica in LaTeX con $...$ (inline) e $$...$$ (display). Niente entita' per
     la matematica (quella la fa KaTeX); entita' HTML solo per il testo (accenti).
   - Stringhe a DOPPI apici: raddoppia i backslash LaTeX ("\\iint", "\\nabla\\times").

   ESEMPIO (cancellare quando si popola). NB: qui sotto le dichiarazioni sono
   scritte SENZA la parola-chiave di dichiarazione, di proposito: le due righe reali
   piu' in basso sono le ANCORE che quiz_assembla.js cerca per trovare la zona dati,
   e nessun commento deve riprodurle alla lettera -
   se comparissero anche in questo commento, l'assemblatore scriverebbe i dati qui
   dentro e il quiz risulterebbe vuoto (successo il 12-08-2026 col quiz di Metodi).
   POOLS = [
     {id:'esempio', name:'1 &middot; Esempio', diff:'3', status:'full'}
   ];
   Q = {};
   Q.esempio = [
     { pool:'esempio', src:'tipo X · manuale', steps:[{
         t:'Il campo $F=(-y,x)$ su $\\mathbb{R}^2\\setminus\\{0\\}$ e\\u2019 conservativo?',
         opts:[{x:'No: il dominio non e\\u2019 semplicemente connesso',c:true},
               {x:'S\\u00ec: e\\u2019 irrotazionale'},
               {x:'S\\u00ec: $\\nabla\\times F=0$ basta'}],
         hint:'Irrotazionale su un dominio con un buco non implica conservativo.',
         sol:'<b>No.</b> $\\nabla\\times F=0$ ma il dominio non e\\u2019 semplicemente '+
             'connesso: la circuitazione su un giro attorno all\\u2019origine vale $2\\pi\\neq0$.'
       }]
     }
   ];
   ===================================================================== */

var POOLS = [
  /* >>> INSERISCI QUI I POOL <<< */
];

var Q = {};
/* >>> INSERISCI QUI I BLOCCHI Q.<id> = [ ... ] <<< */


/* =====================================================================
   ENGINE — NON MODIFICARE sotto questa riga.
   ===================================================================== */
var S = { units:[], ui:0, si:0, correct:0, total:0, answered:false };

/* =====================================================================
   TRACCIA — il quiz ricorda le risposte.  (Accensione, 2026-07-31)
   Prima di questo blocco il motore non salvava una singola risposta da
   nessuna parte: chiuso il tab, il tentativo spariva. Senza questo dato
   la navicella non ha nessun segnale esterno su cui correggersi.
   Blocco autonomo: si innesta identico in qualunque quiz gia' pubblicato.
   ===================================================================== */
var TRACCIA = (function(){
  var CHIAVE = 'navicella.quiz.attempts.v1';
  var attivo = true;
  try { window.localStorage.setItem('__t','1'); window.localStorage.removeItem('__t'); }
  catch(e){ attivo = false; }              // navigazione privata: si degrada in silenzio

  function leggi(){
    if(!attivo) return [];
    try { return JSON.parse(window.localStorage.getItem(CHIAVE)||'[]'); }
    catch(e){ return []; }
  }
  function scrivi(a){
    if(!attivo) return;
    try { window.localStorage.setItem(CHIAVE, JSON.stringify(a)); } catch(e){}
  }
  function registra(rec){
    if(!attivo) return;
    var a = leggi();
    rec.ts = new Date().toISOString();
    rec.corso = (document.title||'').trim();
    a.push(rec);
    if(a.length > 5000) a = a.slice(-5000);   // tetto: non gonfiare il browser
    scrivi(a);
    aggiornaBottone();
  }
  function esporta(){
    var a = leggi();
    if(!a.length){ return; }
    var jsonl = a.map(function(r){ return JSON.stringify(r); }).join('\n')+'\n';
    var blob = new Blob([jsonl], {type:'application/x-ndjson'});
    var url = URL.createObjectURL(blob);
    var nome = 'quiz-attempts-'+(document.title||'quiz').replace(/[^A-Za-z0-9]+/g,'-')
             + '-' + new Date().toISOString().slice(0,10) + '.jsonl';
    var a2 = document.createElement('a');
    a2.href = url; a2.download = nome; document.body.appendChild(a2); a2.click();
    document.body.removeChild(a2); URL.revokeObjectURL(url);
  }
  function svuota(){
    if(!confirm('Cancellare i tentativi salvati in questo browser?')) return;
    scrivi([]); aggiornaBottone();
  }
  function aggiornaBottone(){
    var b = document.getElementById('tracciaBtn');
    var n = leggi().length;
    if(!b){
      if(!n) return;
      b = document.createElement('div');
      b.id = 'tracciaBtn';
      b.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:9999;'
        + 'font:600 13px/1.2 system-ui,sans-serif;display:flex;gap:6px;align-items:center;'
        + 'background:#1f2937;color:#fff;padding:8px 12px;border-radius:10px;'
        + 'box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer;opacity:.92';
      b.title = 'Scarica i tentativi come .jsonl da consegnare alla navicella';
      b.onclick = esporta;
      document.body.appendChild(b);
      var x = document.createElement('span');
      x.textContent = '×';
      x.style.cssText = 'margin-left:6px;opacity:.6;padding:0 3px';
      x.title = 'Svuota';
      x.onclick = function(ev){ ev.stopPropagation(); svuota(); };
      b.appendChild(x);
    }
    if(!n){ b.remove(); return; }
    b.firstChild && b.firstChild.nodeType===3
      ? (b.firstChild.nodeValue = '↓ esporta '+n+' risposte')
      : b.insertBefore(document.createTextNode('↓ esporta '+n+' risposte'), b.firstChild);
  }
  return { registra: registra, esporta: esporta, conta: function(){ return leggi().length; },
           aggiorna: aggiornaBottone };
})();

function poolCount(id){ return (Q[id]||[]).reduce(function(n,u){return n+u.steps.length;},0); }

function renderMenu(){
  var g = document.getElementById('poolGrid');
  g.innerHTML = '';
  POOLS.forEach(function(p){
    var units = Q[p.id]||[];
    var n = poolCount(p.id);
    var empty = units.length===0;
    var card = document.createElement(empty?'div':'button');
    card.className = 'pool-card'+(empty?' empty':'');
    if(!empty) card.onclick = function(){ start(p.id); };
    card.innerHTML =
      '<div class="n">'+p.name+'</div>'+
      '<div class="meta">Difficolt&agrave; '+p.diff+' &middot; '+(empty?'0 domande':(n+' passi')) +'</div>'+
      '<span class="badge '+(p.status==='full'?'full':'todo')+'">'+
        (p.status==='full'?'COMPLETO':'DA ESTENDERE')+'</span>';
    g.appendChild(card);
  });
  typeset(g);
}

function start(poolId){
  var units = [];
  if(poolId==='ALL'){
    POOLS.forEach(function(p){ (Q[p.id]||[]).forEach(function(u){ units.push(u); }); });
  } else {
    units = (Q[poolId]||[]).slice();
  }
  if(units.length===0) return;
  units = shuffle(units.slice());
  S = { units:units, ui:0, si:0, correct:0, total:0, answered:false, poolId:poolId };
  show('quiz');
  renderStep();
}

function poolNameById(id){
  for(var i=0;i<POOLS.length;i++) if(POOLS[i].id===id) return POOLS[i].name;
  return id;
}

function renderStep(){
  var u = S.units[S.ui];
  var st = u.steps[S.si];
  S.answered = false;

  document.getElementById('qpool').innerHTML =
    (S.poolId==='ALL'?'Mischia':poolNameById(S.poolId));
  document.getElementById('qpos').innerHTML =
    'Domanda '+(S.ui+1)+' / '+S.units.length+
    (u.steps.length>1?(' &middot; parte '+(S.si+1)+'/'+u.steps.length):'')+
    ' &middot; <span class="src">'+u.src+'</span>';
  document.getElementById('qbar').style.width = (100*(S.ui)/S.units.length)+'%';

  var fig = document.getElementById('qfig');
  var svg = st.svg || (S.si===0 ? u.svg : null);
  if(svg){ fig.innerHTML = svg; fig.classList.remove('hidden'); typeset(fig); }
  else { fig.innerHTML=''; fig.classList.add('hidden'); }

  var qt = document.getElementById('qtext');
  qt.innerHTML = st.t;
  typeset(qt);

  var opts = shuffle(st.opts.map(function(o){return o;}));
  var box = document.getElementById('qopts');
  box.innerHTML = '';
  opts.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = o.x;
    b.onclick = function(){ answer(b, o, st); };
    box.appendChild(b);
  });
  typeset(box);

  document.getElementById('qhint').classList.remove('show');
  document.getElementById('qsol').classList.remove('show');
  document.getElementById('qcont').classList.add('hidden');
}

function answer(btn, opt, st){
  /* Accensione: ogni click e' un dato. `primo` distingue il primo tentativo sul
     passo (il segnale che conta per un contatore stile PFA) dai ritentativi. */
  TRACCIA.registra({ pool: S.poolId, ui: S.ui, si: S.si,
                     esito: !!opt.c, primo: !S.answered,
                     hint: document.getElementById('qhint').classList.contains('show') });
  if(opt.c){
    btn.classList.add('correct');
    Array.prototype.forEach.call(document.querySelectorAll('#qopts .opt'),
      function(b){ b.disabled = true; });
    document.getElementById('qhint').classList.remove('show');
    var sol = document.getElementById('qsol');
    sol.innerHTML = '<b>Corretto.</b> '+st.sol;
    sol.classList.add('show');
    typeset(sol);
    if(!S.answered){ S.correct++; }
    S.answered = true;
    var c = document.getElementById('qcont');
    var last = (S.si === S.units[S.ui].steps.length-1);
    c.innerHTML = last ? 'Prossima domanda &rarr;' : (st.cont || 'Continua &rarr;');
    c.classList.remove('hidden');
    c.onclick = nextStep;
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    var h = document.getElementById('qhint');
    h.innerHTML = '<b>Rivedi.</b> '+st.hint;
    h.classList.add('show');
    typeset(h);
  }
}

function nextStep(){
  var u = S.units[S.ui];
  S.total++;
  if(S.si < u.steps.length-1){
    S.si++;
    renderStep();
  } else {
    S.ui++;
    S.si = 0;
    if(S.ui >= S.units.length){ endQuiz(); }
    else renderStep();
  }
}

function endQuiz(){
  show('end');
  document.getElementById('endScore').innerHTML = S.correct+' / '+S.total;
  var pct = S.total? Math.round(100*S.correct/S.total):0;
  var msg = pct>=85 ? 'Livello d&rsquo;esame solido.' :
            pct>=60 ? 'Buona base, ma alcuni trabocchetti ti hanno preso.' :
                      'Rivedi i suggerimenti: gli errori sono concettuali, non di calcolo.';
  document.getElementById('endMsg').innerHTML = 'Risposte corrette al primo tentativo. '+msg;
}

function toMenu(){ show('menu'); }

function show(which){
  ['menu','quiz','end'].forEach(function(id){
    document.getElementById(id).classList.toggle('hidden', id!==which);
  });
  window.scrollTo(0,0);
}

window.addEventListener('DOMContentLoaded', renderMenu);
</script>
</body>
</html>
